<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ALMOXA PRO — Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./mobile.css">
<!-- Bibliotecas de terceiros usadas pelos módulos mobile/pdf.js e mobile/qrcode.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
</head>
<body>
  <div id="appRoot"></div>
  <div id="roleSwitchHost"></div>

  <script type="module" src="./app.js"></script>

  <!-- Painel de teste: trocar papel/ambiente sem backend real conectado.
       Não faz parte do app de produção — remover ao publicar para usuários finais. -->
  <script type="module">
    import { Session } from '../core/session.js';
    import { resetDemoDb } from '../api/demo-data.js';

    function montarPainelTeste() {
      if (!Session.isAuthenticated()) return;
      const host = document.getElementById('roleSwitchHost');
      host.innerHTML = `
        <div class="role-switch">
          <b>MODO TESTE</b> · papel:
          <select id="rsRole">
            <option value="colaborador">colaborador</option>
            <option value="seguranca">seguranca</option>
            <option value="almoxarife">almoxarife</option>
            <option value="gestor">gestor</option>
          </select>
          <button class="rs-btn" id="rsResetDb">Reiniciar dados demo</button>
          <button class="rs-btn" id="rsSwitchEnv">Trocar ambiente</button>
        </div>`;
      const sel = document.getElementById('rsRole');
      sel.value = Session.papelAtivo() || 'colaborador';
      sel.onchange = () => { Session.setRoleOverride(sel.value); location.reload(); };
      document.getElementById('rsResetDb').onclick = () => { resetDemoDb(); location.reload(); };
      document.getElementById('rsSwitchEnv').onclick = () => { localStorage.removeItem('almoxapro_forced_env'); location.href = '../index.html'; };
    }
    // roda depois do app montar a tela de identificação/sessão
    setTimeout(montarPainelTeste, 700);
    document.addEventListener('click', () => setTimeout(montarPainelTeste, 300));
  </script>
</body>
</html>
