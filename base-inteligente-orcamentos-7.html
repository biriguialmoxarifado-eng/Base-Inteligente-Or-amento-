<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base Inteligente de Orçamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --navy-950:#0B1C2C;
    --navy-900:#102A40;
    --navy-800:#153A56;
    --paper:#EEF1F4;
    --paper-card:#FFFFFF;
    --ink:#16202B;
    --ink-soft:#526071;
    --line:#CBD5DE;
    --line-soft:#E1E7ED;
    --blue:#2F6FED;
    --blue-soft:#E8EFFE;
    --copper:#C98A2C;
    --copper-soft:#FBF0DC;
    --green:#2F9E63;
    --green-soft:#E6F6ED;
    --amber:#D9A62E;
    --amber-soft:#FBF3DD;
    --red:#D9483D;
    --red-soft:#FBEAE8;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{height:100%;}
  body{
    font-family:'IBM Plex Sans',sans-serif;
    color:var(--ink);
    background:var(--paper);
    display:flex;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:236px;
    flex-shrink:0;
    background:var(--navy-950);
    color:#CBD9E6;
    display:flex;
    flex-direction:column;
    padding:22px 14px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 8px 22px 8px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    margin-bottom:18px;
  }
  .brand-mark{
    width:34px;height:34px;border:1.5px solid var(--copper);
    border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--copper);font-size:13px;
    position:relative;
  }
  .brand-mark::after{
    content:'';position:absolute;inset:-5px;border:1px dashed rgba(201,138,44,0.35);border-radius:9px;
  }
  .brand-text{line-height:1.15;}
  .brand-text .t1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;color:#fff;letter-spacing:.2px;}
  .brand-text .t2{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--copper);letter-spacing:1.5px;}

  nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;border-radius:7px;cursor:pointer;
    font-size:13.5px;color:#B8C6D6;
    border:1px solid transparent;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item .ic{width:16px;text-align:center;font-size:13px;opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,0.05);color:#fff;}
  .nav-item.active{background:var(--navy-800);color:#fff;border-color:rgba(201,138,44,0.35);}
  .nav-badge{
    margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:9px;
    padding:1px 6px;border-radius:20px;background:rgba(255,255,255,0.08);color:#9FB0C2;
  }
  .sidebar-foot{
    margin-top:auto;padding:12px 10px 0 10px;border-top:1px solid rgba(255,255,255,0.08);
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#5E7085;letter-spacing:.4px;
  }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    min-width:0;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:34px 34px;
    background-position:-1px -1px;
  }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 32px;border-bottom:1px solid var(--line);
    background:rgba(238,241,244,0.75);backdrop-filter:blur(3px);
    position:sticky;top:0;z-index:5;
  }
  .topbar h1{font-size:19px;margin:0;font-weight:700;}
  .topbar .sub{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);letter-spacing:.5px;margin-top:2px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .pill{
    font-family:'IBM Plex Mono',monospace;font-size:10px;padding:4px 10px;border-radius:20px;
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);
  }
  .content{padding:28px 32px 60px 32px;}

  /* ---------- Cards / blueprint framing ---------- */
  .card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    position:relative;
    padding:18px 20px;
  }
  .card-tag{
    position:absolute;top:-9px;left:14px;background:var(--paper);
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.2px;
    color:var(--ink-soft);padding:0 6px;text-transform:uppercase;
  }
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:26px;}
  .kpi .kpi-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);letter-spacing:.8px;text-transform:uppercase;}
  .kpi .kpi-value{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;margin-top:6px;}
  .kpi .kpi-value.accent{color:var(--copper);}
  .kpi .kpi-value.blue{color:var(--blue);}
  .kpi .kpi-value.green{color:var(--green);}
  .kpi .kpi-value.red{color:var(--red);}

  section.block{margin-bottom:30px;}
  .block-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
  .block-head h2{font-size:15px;margin:0;font-weight:600;}
  .block-head .note{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);}

  /* ---------- Buttons / inputs ---------- */
  button{font-family:'IBM Plex Sans',sans-serif;cursor:pointer;}
  .btn{
    border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:9px 15px;border-radius:7px;font-size:13px;font-weight:500;
    display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-soft);}
  .btn-primary{background:var(--navy-950);color:#fff;border-color:var(--navy-950);}
  .btn-primary:hover{background:var(--navy-800);}
  .btn-accent{background:var(--copper);color:#fff;border-color:var(--copper);}
  .btn-accent:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
  .btn-ghost:hover{color:var(--ink);text-decoration:underline;}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}
  .btn-danger{color:var(--red);border-color:var(--red-soft);background:var(--red-soft);}
  input[type=text],input[type=search],input[type=number],select,textarea{
    font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:8px 10px;
    border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);
  }
  textarea{font-family:'IBM Plex Mono',monospace;font-size:12px;width:100%;resize:vertical;}
  label{font-size:12px;color:var(--ink-soft);font-weight:500;}

  /* ---------- Table ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.6px;
    text-transform:uppercase;color:var(--ink-soft);padding:8px 10px;border-bottom:1.5px solid var(--line);
  }
  tbody td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  tbody tr:hover{background:var(--blue-soft);}
  .num{font-family:'IBM Plex Mono',monospace;text-align:right;}
  .table-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .table-scroll{max-height:520px;overflow:auto;}

  .status-chip{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;
    padding:3px 9px;border-radius:20px;font-family:'IBM Plex Mono',monospace;
  }
  .status-Pendente{background:#EEF1F4;color:var(--ink-soft);}
  .status-Confirmado{background:var(--green-soft);color:var(--green);}
  .status-Aprovado{background:var(--green-soft);color:var(--green);}

  /* ---------- Import zone ---------- */
  .import-tabs{display:flex;gap:6px;margin-bottom:16px;}
  .import-tab{
    padding:8px 14px;border-radius:7px 7px 0 0;font-size:13px;font-weight:500;cursor:pointer;
    border:1px solid var(--line);border-bottom:none;background:#fff;color:var(--ink-soft);
  }
  .import-tab.active{background:var(--paper-card);color:var(--ink);border-color:var(--copper);}
  .dropzone{
    border:1.5px dashed var(--line);border-radius:var(--radius);padding:34px 20px;text-align:center;
    background:#fff;color:var(--ink-soft);font-size:13px;
  }
  .dropzone.drag{border-color:var(--copper);background:var(--copper-soft);}
  .dropzone strong{color:var(--ink);}
  .mapping-row{display:grid;grid-template-columns:1fr 26px 1fr auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);}
  .mapping-row:last-child{border-bottom:none;}
  .mapping-found{font-family:'IBM Plex Mono',monospace;font-size:12.5px;background:var(--paper);padding:6px 9px;border-radius:6px;border:1px solid var(--line);}
  .conf-badge{font-family:'IBM Plex Mono',monospace;font-size:9.5px;padding:2px 6px;border-radius:20px;}
  .conf-alta{background:var(--green-soft);color:var(--green);}
  .conf-media{background:var(--amber-soft);color:#93761f;}
  .conf-baixa{background:var(--red-soft);color:var(--red);}
  .conf-none{background:#EEF1F4;color:var(--ink-soft);}

  .hidden{display:none !important;}
  .empty-state{padding:44px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state .ic{font-size:26px;margin-bottom:8px;}
  .toast{
    position:fixed;bottom:22px;right:22px;background:var(--navy-950);color:#fff;
    padding:11px 18px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.25);
    display:flex;align-items:center;gap:8px;z-index:50;border:1px solid var(--copper);
  }
  .phase-note{
    display:flex;gap:10px;align-items:flex-start;background:var(--copper-soft);border:1px solid #EAD3A0;
    border-radius:var(--radius);padding:12px 14px;font-size:12.5px;color:#7A5A17;margin-bottom:18px;
  }
  .stub-wrap{padding:60px 20px;text-align:center;}
  .stub-wrap .badge{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;
    padding:4px 12px;border-radius:20px;background:var(--navy-950);color:#fff;margin-bottom:14px;
  }
  .stub-wrap h3{margin:0 0 8px 0;font-size:17px;}
  .stub-wrap p{color:var(--ink-soft);font-size:13px;max-width:440px;margin:0 auto;}
  .bar-row{display:flex;align-items:center;gap:10px;font-size:12.5px;margin-bottom:8px;}
  .bar-row .lab{width:100px;flex-shrink:0;color:var(--ink-soft);}
  .bar-track{flex:1;height:8px;background:var(--paper);border-radius:6px;overflow:hidden;border:1px solid var(--line-soft);}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--copper));}
  .bar-val{font-family:'IBM Plex Mono',monospace;font-size:11px;width:70px;text-align:right;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .toolbar .flex-spacer{flex:1;}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(11,28,44,0.55);display:flex;align-items:center;justify-content:center;z-index:60;
  }
  .modal{background:#fff;border-radius:12px;padding:22px 24px;width:420px;max-width:92vw;border:1px solid var(--line);}
  .modal h3{margin:0 0 14px 0;font-size:15px;}
  .field-row{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .field-row input,.field-row select{width:100%;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

  /* ---------- Fornecedores ---------- */
  .modal-wide{width:560px;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-grid .full{grid-column:1 / -1;}
  .supplier-card{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:relative;
  }
  .supplier-avatar{
    width:38px;height:38px;border-radius:8px;background:var(--navy-950);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;flex-shrink:0;
  }
  .supplier-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;}
  .supplier-name{font-weight:600;font-size:14px;line-height:1.3;}
  .supplier-fantasy{font-size:12px;color:var(--ink-soft);}
  .supplier-meta{font-size:12px;color:var(--ink-soft);display:flex;flex-direction:column;gap:4px;margin-top:8px;}
  .supplier-meta .row{display:flex;gap:6px;}
  .supplier-meta .k{width:16px;flex-shrink:0;text-align:center;}
  .supplier-actions{display:flex;gap:6px;margin-top:12px;border-top:1px solid var(--line-soft);padding-top:10px;}
  .supplier-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .ocr-drop{
    border:1.5px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--ink-soft);
    background:var(--paper);font-size:12.5px;cursor:pointer;
  }
  .ocr-drop:hover{border-color:var(--copper);}

  /* ---------- Cotações ---------- */
  .subtabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--line);}
  .subtab{
    padding:9px 14px;font-size:13px;font-weight:500;color:var(--ink-soft);cursor:pointer;
    border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .subtab.active{color:var(--ink);border-bottom-color:var(--copper);}
  .wizard-steps{display:flex;gap:0;margin-bottom:22px;}
  .wizard-step{
    flex:1;text-align:center;padding:10px 6px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    color:var(--ink-soft);border-bottom:2px solid var(--line);position:relative;
  }
  .wizard-step.active{color:var(--copper);border-bottom-color:var(--copper);font-weight:600;}
  .wizard-step.done{color:var(--green);border-bottom-color:var(--green);}
  .select-search{width:100%;margin-bottom:12px;}
  .forn-pick{
    display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
    border-radius:8px;background:#fff;cursor:pointer;margin-bottom:8px;
  }
  .forn-pick:hover{border-color:var(--copper);}
  .forn-pick.selected{border-color:var(--copper);background:var(--copper-soft);}
  .item-check-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line-soft);font-size:13px;}
  .item-check-row input{width:15px;height:15px;}
  .chip-filter{
    font-size:11.5px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:#fff;
    color:var(--ink-soft);cursor:pointer;
  }
  .chip-filter.active{background:var(--navy-950);color:#fff;border-color:var(--navy-950);}
  .wizard-nav{display:flex;justify-content:space-between;margin-top:18px;}
  .solic-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:9px;background:#fff;margin-bottom:10px;}
  .solic-code{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--navy-950);}
  .solic-meta{font-size:12px;color:var(--ink-soft);}
  .status-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 9px;border-radius:20px;background:var(--paper);color:var(--ink-soft);}
  .status-tag.enviada{background:var(--blue-soft);color:var(--blue);}
  .status-tag.recebida{background:var(--green-soft);color:var(--green);}
  .match-row{display:grid;grid-template-columns:1fr 24px 1fr 80px 80px 120px;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;}
  .match-shortfall{font-size:10px;color:var(--red);margin-top:2px;}
  .match-row:last-child{border-bottom:none;}
  .match-conf{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border-radius:20px;text-align:center;}
  .match-actions{display:flex;gap:4px;}
  .compare-table th, .compare-table td{white-space:nowrap;}
  .compare-best{color:var(--green);font-weight:600;}

  /* ---------- Sincronização Google Sheets ---------- */
  .sync-panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;}
  .sync-status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);margin-top:8px;}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
  .sync-dot.ok{background:var(--green);}
  .sync-dot.err{background:var(--red);}
  .sync-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .toggle-row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--ink-soft);}

  /* ---------- Barra flutuante de seleção (Base de Itens) ---------- */
  #selectionBar{
    position:fixed;left:236px;right:0;bottom:0;background:var(--navy-950);color:#fff;
    padding:12px 32px;display:none;align-items:center;gap:14px;z-index:20;
    box-shadow:0 -6px 20px rgba(0,0,0,0.2);border-top:1px solid var(--copper);
  }
  #selectionBar.show{display:flex;}

  /* ---------- Parâmetros de Aprovação ---------- */
  .crit-group-title{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1px;color:var(--ink-soft);text-transform:uppercase;margin:22px 0 10px 0;}
  .crit-card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px 16px;margin-bottom:8px;}
  .crit-card.inativo{opacity:.5;}
  .crit-top{display:flex;align-items:center;gap:10px;}
  .crit-top .crit-nome{font-weight:600;font-size:13.5px;flex:1;}
  .crit-order-btns{display:flex;flex-direction:column;gap:1px;}
  .crit-order-btns button{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:11px;padding:0 4px;line-height:1;}
  .crit-order-btns button:hover{color:var(--ink);}
  .crit-obrig-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;padding:2px 7px;border-radius:20px;background:var(--red-soft);color:var(--red);}
  .crit-config{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center;font-size:12.5px;}
  .crit-config select, .crit-config input[type=text], .crit-config input[type=number]{padding:6px 8px;font-size:12.5px;}
  .peso-input{width:60px !important;text-align:right;}
  .peso-total-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;font-size:12.5px;font-weight:600;margin-top:14px;}
  .peso-total-bar.ok{background:var(--green-soft);color:var(--green);}
  .peso-total-bar.warn{background:var(--amber-soft);color:#93761f;}
  .perfil-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:8px;}

  /* ---------- Resultado da análise ---------- */
  .rank-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;position:relative;}
  .rank-card.top{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset;}
  .rank-card.desqualificado{border-color:var(--red);background:var(--red-soft);}
  .rank-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .rank-pos{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--ink-soft);width:26px;}
  .rank-nome{font-weight:700;font-size:14.5px;flex:1;}
  .rank-pct{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;padding:3px 10px;border-radius:20px;}
  .rank-pct.green{background:var(--green-soft);color:var(--green);}
  .rank-pct.yellow{background:var(--amber-soft);color:#93761f;}
  .rank-pct.red{background:var(--red-soft);color:var(--red);}
  .rank-checklist{display:flex;flex-direction:column;gap:4px;font-size:12.5px;margin-bottom:10px;}
  .rank-explic{font-size:12px;color:var(--ink-soft);background:var(--paper);border-radius:7px;padding:10px 12px;line-height:1.6;}

/* ---------------- Conexão com planilha Excel local (File System Access API) ---------------- */
let connectedFileHandle = null;
const supportsFileSystemAccess = 'showOpenFilePicker' in window;
let fileConnectInfo = { status:'idle', message:'Nenhuma planilha conectada. Os dados ficam salvos só neste navegador.' };

function safeParseArray(v){
  if(Array.isArray(v)) return v;
  try{ const p = JSON.parse(v); return Array.isArray(p) ? p : []; }catch(e){ return []; }
}
function recomputeNextIds(){
  const maxOf = (arr, key)=> arr.reduce((m,x)=> Math.max(m, Number(x[key])||0), 0);
  state.nextId = maxOf(state.itens,'id') + 1;
  state.nextFornecedorId = maxOf(state.fornecedores,'id') + 1;
  state.nextSolicitacaoId = maxOf(state.solicitacoes,'id') + 1;
  state.nextOrcamentoId = maxOf(state.orcamentos,'id') + 1;
  state.nextItemOrcamentoId = maxOf(state.itensOrcamento,'id') + 1;
  let maxSeq = 0;
  state.solicitacoes.forEach(s=>{
    const m = String(s.codigo||'').match(/COT-(\d+)/);
    if(m) maxSeq = Math.max(maxSeq, Number(m[1]));
  });
  state.solicitacaoSeq = maxSeq + 1;
}
function buildFullWorkbook(){
  const payload = {
    BASE_ITENS: state.itens,
    FORNECEDORES: state.fornecedores,
    SOLICITACOES: state.solicitacoes.map(s=> ({ ...s, itemIds: JSON.stringify(s.itemIds) })),
    ORCAMENTOS: state.orcamentos,
    ITENS_ORCAMENTO: state.itensOrcamento,
    CORRESPONDENCIAS: state.correspondencias,
  };
  const wb = XLSX.utils.book_new();
  Object.keys(payload).forEach(tab=>{
    const ws = XLSX.utils.json_to_sheet(payload[tab]);
    XLSX.utils.book_append_sheet(wb, ws, tab);
  });
  return wb;
}
function parseFullWorkbookAndApply(wb){
  const readSheet = name => wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name], {defval:''}) : [];
  state.itens = readSheet('BASE_ITENS').map(i=>({
    ...i, id:Number(i.id)||uid('IT'), quantidade:Number(i.quantidade)||0, valorBase:Number(i.valorBase)||0,
    status: i.status || 'Pendente',
  }));
  state.fornecedores = readSheet('FORNECEDORES').map(f=>({ ...f, id:Number(f.id) }));
  state.solicitacoes = readSheet('SOLICITACOES').map(s=>({
    ...s, id:Number(s.id), fornecedorId:Number(s.fornecedorId), itemIds: safeParseArray(s.itemIds).map(Number),
  }));
  state.orcamentos = readSheet('ORCAMENTOS').map(o=>({
    ...o, id:Number(o.id), solicitacaoId:Number(o.solicitacaoId), fornecedorId:Number(o.fornecedorId),
    valorProdutos:Number(o.valorProdutos)||0, desconto:Number(o.desconto)||0, frete:Number(o.frete)||0, total:Number(o.total)||0,
  }));
  state.itensOrcamento = readSheet('ITENS_ORCAMENTO').map(io=>({
    ...io, id:Number(io.id), orcamentoId:Number(io.orcamentoId), itemBaseId:Number(io.itemBaseId),
    valorUnitario:Number(io.valorUnitario)||0, valorTotal:Number(io.valorTotal)||0,
  }));
  state.correspondencias = readSheet('CORRESPONDENCIAS');
  recomputeNextIds();
  saveState();
}
async function autoSaveToConnectedFile(){
  if(!connectedFileHandle){ atualizarPillSyncStatus(); return; }
  try{
    const wb = buildFullWorkbook();
    const wbout = XLSX.write(wb, { bookType:'xlsx', type:'array' });
    const writable = await connectedFileHandle.createWritable();
    await writable.write(wbout);
    await writable.close();
    fileConnectInfo = { status:'ok', message:'Salvo automaticamente às '+new Date().toLocaleTimeString('pt-BR') };
  }catch(err){
    fileConnectInfo = { status:'err', message:'Erro ao salvar na planilha: '+err.message };
  }
  renderFileConnectStatus();
  atualizarPillSyncStatus();
}
/* Indicador fixo na topbar, visível em qualquer tela — pra nunca mais passar despercebido
   quando a conexão com o Excel cair (isso acontece sozinho ao fechar/reabrir o navegador). */
function atualizarPillSyncStatus(){
  const pill = document.getElementById('pillSyncStatus');
  if(!pill) return;
  if(!connectedFileHandle){
    pill.innerHTML = '⚪ Sem Excel conectado';
    pill.style.color = 'var(--ink-soft)';
    pill.title = 'Nenhuma planilha conectada — os dados ficam salvos só neste navegador. Clique para conectar.';
    return;
  }
  if(fileConnectInfo.status==='ok'){
    pill.innerHTML = '🟢 Sincronizado';
    pill.style.color = 'var(--green)';
  }else if(fileConnectInfo.status==='err'){
    pill.innerHTML = '🔴 Erro ao sincronizar';
    pill.style.color = 'var(--red)';
  }else{
    pill.innerHTML = '⚪ Conectando...';
    pill.style.color = 'var(--ink-soft)';
  }
  pill.title = fileConnectInfo.message;
}
function renderFileConnectStatus(){
  const el = document.getElementById('fileConnectStatusLine');

async function conectarPlanilhaExistente(){
  if(!supportsFileSystemAccess){

    connectedFileHandle = handle;

      if(confirm('Essa planilha já tem conteúdo. Carregar esses dados para dentro do sistema agora? (substitui a base atual)')){

/* ---------------- Utilidades ---------------- */
function normalize(str){
  return String(str||'')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  const dp = Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
    }
  }
  return dp[m][n];
}
function similarity(a,b){
  const na=normalize(a), nb=normalize(b);
  if(!na||!nb) return 0;
  if(na===nb) return 100;
  if(na.includes(nb)||nb.includes(na)) return 85;
  const dist = levenshtein(na,nb);
  const maxLen = Math.max(na.length,nb.length);
  return Math.max(0, Math.round((1-dist/maxLen)*70));
}

/* ==================================================================
   CORRESPONDÊNCIA INTELIGENTE DE PRODUTOS — V0.4.1
   Usado ao vincular o item da base com a descrição do fornecedor no PDF.
   Não exige texto igual: entende medidas ("25mm"="25 MM", "6m"="6 metros")
   e sinaliza conflitos técnicos reais (ex: "CP II 32" ≠ "CP III 40")
   mesmo quando o texto é parecido.
================================================================== */
function canonicalizarUnidades(texto){
  let t = normalize(texto);
  t = t.replace(/(\d+(?:[.,]\d+)?)\s*mm\b/g, '$1mm');
  t = t.replace(/(\d+(?:[.,]\d+)?)\s*cm\b/g, '$1cm');
  t = t.replace(/(\d+(?:[.,]\d+)?)\s*(metros?|metro)\b/g, '$1m');
  t = t.replace(/(\d+(?:[.,]\d+)?)\s*kg\b/g, '$1kg');
  t = t.replace(/(\d+(?:[.,]\d+)?)\s*(litros?|litro)\b/g, '$1l');
  t = t.replace(/\bunidades?\b/g, 'un');
  return t;
}
function tokenSimilarity(a, b){
  const ta = new Set(canonicalizarUnidades(a).split(' ').filter(w=>w.length>1));
  const tb = new Set(canonicalizarUnidades(b).split(' ').filter(w=>w.length>1));
  if(!ta.size || !tb.size) return 0;
  let inter = 0;
  ta.forEach(w=>{ if(tb.has(w)) inter++; });
  const union = new Set([...ta, ...tb]).size;
  return Math.round((inter/union)*100);
}
function extrairMedidas(texto){
  const t = normalize(texto);
  const medidas = {};
  let m;
  if(m = t.match(/(\d+(?:[.,]\d+)?)\s*mm\b/)) medidas.mm = parseFloat(m[1].replace(',','.'));
  if(m = t.match(/(\d+(?:[.,]\d+)?)\s*cm\b/)) medidas.cm = parseFloat(m[1].replace(',','.'));
  if(m = t.match(/(\d+(?:[.,]\d+)?)\s*(m|metros?|metro)\b/)) medidas.m = parseFloat(m[1].replace(',','.'));
  if(m = t.match(/(\d+(?:[.,]\d+)?)\s*kg\b/)) medidas.kg = parseFloat(m[1].replace(',','.'));
  if(m = t.match(/(\d+(?:[.,]\d+)?)\s*(l|litros?|litro)\b/)) medidas.l = parseFloat(m[1].replace(',','.'));
  return medidas;
}
function extrairClasseTecnica(texto){
  const t = normalize(texto);
  const digitoParaRomano = {'1':'i','2':'ii','3':'iii','4':'iv','5':'v'};
  let m = t.match(/\bcp\s*(iii|ii|iv|v|i|[1-5])\s*(\d{2,3})?\b/);
  if(m){
    const classeNorm = digitoParaRomano[m[1]] || m[1];
    return { tipo:'cimento', classe:'cp'+classeNorm, subclasse:m[2]||null };
  }
  m = t.match(/\bdn\s*(\d{2,4})\b/);
  if(m) return { tipo:'dn', classe:'dn', subclasse:m[1] };
  m = t.match(/\bpn\s*(\d{1,3})\b/);
  if(m) return { tipo:'pn', classe:'pn', subclasse:m[1] };
  return null;
}
const LABEL_MEDIDA = { mm:'Diâmetro', cm:'Diâmetro', m:'Comprimento', kg:'Peso', l:'Volume' };
function avaliarCorrespondenciaProduto(descBase, descForn){
  const simTexto = tokenSimilarity(descBase, descForn);
  const motivos = [];
  let conflito = false;

  const classeBase = extrairClasseTecnica(descBase);
  const classeForn = extrairClasseTecnica(descForn);
  if(classeBase && classeForn && classeBase.tipo===classeForn.tipo){
    if(classeBase.classe !== classeForn.classe){
      conflito = true;
      motivos.push({ ok:false, forte:true, texto:`Classe técnica divergente: ${classeBase.classe.toUpperCase()}${classeBase.subclasse?' '+classeBase.subclasse:''} ≠ ${classeForn.classe.toUpperCase()}${classeForn.subclasse?' '+classeForn.subclasse:''}` });
    }else if(classeBase.subclasse && classeForn.subclasse && classeBase.subclasse !== classeForn.subclasse){
      conflito = true;
      motivos.push({ ok:false, forte:true, texto:`Subclasse divergente: ${classeBase.classe.toUpperCase()} ${classeBase.subclasse} ≠ ${classeForn.classe.toUpperCase()} ${classeForn.subclasse}` });
    }else{
      motivos.push({ ok:true, texto:`Classe técnica compatível (${classeBase.classe.toUpperCase()}${classeBase.subclasse?' '+classeBase.subclasse:''})` });
    }
  }

  const medBase = extrairMedidas(descBase);
  const medForn = extrairMedidas(descForn);
  Object.keys(LABEL_MEDIDA).forEach(chave=>{
    if(medBase[chave]!==undefined && medForn[chave]!==undefined){
      if(Math.abs(medBase[chave]-medForn[chave])<0.01){
        motivos.push({ ok:true, texto:`${LABEL_MEDIDA[chave]} compatível (${medBase[chave]}${chave})` });
      }else{
        conflito = true;
        motivos.push({ ok:false, forte:true, texto:`${LABEL_MEDIDA[chave]} divergente: ${medBase[chave]}${chave} ≠ ${medForn[chave]}${chave}` });
      }
    }
  });

  let percentual;
  if(conflito){
    percentual = Math.min(simTexto, 39);
  }else{
    const confirmacoes = motivos.filter(m=>m.ok).length;
    percentual = Math.min(100, simTexto + confirmacoes*8);
  }

  if(!motivos.length){
    motivos.push({ ok: percentual>=60, forte:false, texto: percentual>=60 ? 'Descrição textual compatível' : 'Descrição textual pouco parecida — nenhuma medida ou classe técnica reconhecida para conferir' });
  }

  const faixa = percentual>=90?'alta':(percentual>=80?'boa':(percentual>=60?'parcial':(percentual>=40?'baixa':'incompativel')));
  return { percentual, faixa, conflito, motivos };
}

function bestFieldScore(header, field){
  let best = 0;
  for(const alias of field.aliases){ best = Math.max(best, similarity(header, alias)); }
  best = Math.max(best, similarity(header, field.label));
  return best;
}
function autoMapColumns(headers){
  const pairs = [];
  headers.forEach((h, idx)=>{
    FIELDS.forEach(f=>{
      pairs.push({ idx, header:h, field:f.key, score: bestFieldScore(h, f) });
    });
  });
  pairs.sort((a,b)=> b.score-a.score);
  const usedCols = new Set(), usedFields = new Set();
  const mapping = {}; // fieldKey -> {colIdx, score}
  for(const p of pairs){
    if(p.score < 35) continue;
    if(usedCols.has(p.idx) || usedFields.has(p.field)) continue;
    mapping[p.field] = { colIdx:p.idx, score:p.score };
    usedCols.add(p.idx); usedFields.add(p.field);
  }
  return mapping;
}
function confLevel(score){
  if(score>=80) return {c:'alta', label:'Alta'};
  if(score>=50) return {c:'media', label:'Média'};
  if(score>0) return {c:'baixa', label:'Baixa'};
  return {c:'none', label:'—'};
}
function fmtMoney(n){
  n = Number(n)||0;
  return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function toast(msg){

}
function uid(prefix){ return prefix + '-' + String(Date.now()).slice(-6) + Math.floor(Math.random()*90+10); }

/* ==================================================================
   CORE DE DADOS — V0.4 FASE 1 (BLINDAGEM)
   Funções centrais reutilizáveis: números BR, log de auditoria, backup.
   Nenhum módulo deve interpretar moeda ou gerar log por conta própria —
   todos usam essas funções daqui.
================================================================== */

/* -- Motor único de valores brasileiros --
   Interpreta "R$ 1.234,56", "1.234,56", "1234,56", "1.234" etc.
   Nunca converte silenciosamente algo inválido em zero: devolve {valid:false}. */
function parseBRNumber(raw, _profundidade){
  _profundidade = _profundidade || 0;
  if(raw===null || raw===undefined || raw==='') return { valid:false, value:0 };
  if(typeof raw === 'number') return { valid: !isNaN(raw), value: isNaN(raw)?0:raw };
  let s = String(raw).trim().replace(/^R\$\s*/i,'').trim().replace(/\s+/g,'');
  if(s==='') return { valid:false, value:0 };
  const brComMilhar = /^-?\d{1,3}(\.\d{3})*(,\d+)?$/;
  const brSemMilhar = /^-?\d+,\d+$/;
  const inteiro = /^-?\d+$/;
  const usComMilhar = /^-?\d{1,3}(,\d{3})*(\.\d+)?$/;
  let normalizado = null;
  if(brComMilhar.test(s) || brSemMilhar.test(s)){
    normalizado = s.replace(/\./g,'').replace(',', '.');
  }else if(inteiro.test(s)){
    normalizado = s;
  }else if(usComMilhar.test(s)){
    normalizado = s.replace(/,/g,'');
  }else if(_profundidade < 1){
    const limpo = s.replace(/[^0-9,.\-]/g,'');
    if(limpo && limpo!==s) return parseBRNumber(limpo, _profundidade+1);
    return { valid:false, value:0 };
  }else{
    return { valid:false, value:0 };
  }
  const num = Number(normalizado);
  return { valid: !isNaN(num), value: isNaN(num)?0:num };
}
function formatBRNumber(n, casas){
  casas = casas===undefined ? 2 : casas;
  n = Number(n)||0;
  return n.toLocaleString('pt-BR', { minimumFractionDigits:casas, maximumFractionDigits:casas });
}

/* -- Log de auditoria -- registra quem fez o quê, quando, e por quê.
   O histórico nunca é sobrescrito — só cresce. */
function registerLog(modulo, acao, registro, extra){
  extra = extra || {};
  state.logSistema.push({
    id: state.nextLogId++,
    data: new Date().toLocaleString('pt-BR'),
    modulo, acao, registro,
    valorAnterior: extra.valorAnterior!==undefined ? extra.valorAnterior : null,
    valorNovo: extra.valorNovo!==undefined ? extra.valorNovo : null,
    motivo: extra.motivo || '',
    origem: extra.origem || 'usuário',
  });
  // não chama saveState aqui de propósito — quem chamar registerLog deve
  // seguir chamando saveState() normalmente, pra não duplicar gravações
}

/* -- Backup com metadados -- baixa um arquivo JSON completo, com data/hora/versão/quantidade de registros. */
function gerarBackupCompleto(motivo){
  const agora = new Date();
  const meta = {
    versao: 'v0.4',
    data: agora.toLocaleDateString('pt-BR'),
    hora: agora.toLocaleTimeString('pt-BR'),
    origem: motivo || 'manual',
    quantidadeRegistros: {
      itens: state.itens.length,
      fornecedores: state.fornecedores.length,
      solicitacoes: state.solicitacoes.length,
      orcamentos: state.orcamentos.length,
    },
  };
  const payload = { meta, dados: state };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const nomeArquivo = 'backup-'+meta.data.replace(/\//g,'-')+'-'+meta.hora.replace(/:/g,'')+'.json';
  downloadBlob(blob, nomeArquivo);
  state.ultimoBackup = { data: meta.data+' '+meta.hora, motivo: meta.origem };
  registerLog('Backup', 'Backup gerado', nomeArquivo, { motivo: meta.origem });
  return nomeArquivo;
}
/* -- Restaurar backup a partir de um arquivo .json exportado pelo próprio sistema -- */
function restaurarBackup(payload){
  const dados = payload && payload.dados ? payload.dados : payload; // aceita backup novo (com meta) ou JSON antigo simples
  if(!dados || !Array.isArray(dados.itens)){ toast('Arquivo de backup inválido.'); return false; }
  state = dados;
  // garante que campos novos existam mesmo em backups de versões anteriores
  if(!state.logSistema) state.logSistema = [];
  if(!state.nextLogId) state.nextLogId = 1;
  if(state.ultimoBackup===undefined) state.ultimoBackup = null;
  saveState();
  registerLog('Backup', 'Backup restaurado', payload.meta ? payload.meta.data+' '+payload.meta.hora : '(arquivo antigo)', {});
  return true;
}

/* -- Diagnóstico de integridade -- verifica referências quebradas entre os módulos. */
function diagnosticarIntegridade(){
  const problemas = [];
  state.orcamentos.forEach(o=>{
    if(!state.solicitacoes.find(s=>s.id===o.solicitacaoId)){
      problemas.push({ modulo:'Orçamentos', problema:'Orçamento sem solicitação vinculada', registro:'orçamento nº '+(o.numero||o.id) });
    }
    if(!state.fornecedores.find(f=>f.id===o.fornecedorId)){
      problemas.push({ modulo:'Orçamentos', problema:'Fornecedor não encontrado', registro:'orçamento nº '+(o.numero||o.id) });
    }
  });
  state.itensOrcamento.forEach(io=>{
    if(!state.itens.find(i=>i.id===io.itemBaseId)){
      problemas.push({ modulo:'Itens do Orçamento', problema:'Item da base não encontrado (removido depois de cotado)', registro:'item_orc-'+io.id });
    }
  });
  state.solicitacoes.filter(s=>!s.arquivada).forEach(s=>{
    if(!state.fornecedores.find(f=>f.id===s.fornecedorId)){
      problemas.push({ modulo:'Solicitações', problema:'Fornecedor não encontrado', registro:s.codigo });
    }
    if(!s.itemIds || !s.itemIds.length){
      problemas.push({ modulo:'Solicitações', problema:'Solicitação sem nenhum item', registro:s.codigo });
    }
  });
  state.analises.forEach(a=>{
    if(!a.resultados || !a.resultados.length){
      problemas.push({ modulo:'Análises', problema:'Análise sem nenhum orçamento avaliado', registro:'análise de '+a.data });
    }
  });
  // IDs duplicados (checagem simples por tabela)
  function checarDuplicados(lista, nomeModulo){
    const vistos = new Set();
    lista.forEach(item=>{
      if(vistos.has(item.id)) problemas.push({ modulo:nomeModulo, problema:'ID duplicado', registro:'id '+item.id });
      vistos.add(item.id);
    });
  }
  checarDuplicados(state.itens, 'Base de Itens');
  checarDuplicados(state.fornecedores, 'Fornecedores');
  checarDuplicados(state.solicitacoes, 'Solicitações');
  checarDuplicados(state.orcamentos, 'Orçamentos');
  return problemas;
}

/* ---------------- Parsing: arquivo / colar ---------------- */
let loadedWorkbook = null;
function parseWorkbookFile(file, cb){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      loadedWorkbook = wb;
      loadSheetIntoPending(wb.SheetNames[0]);
      if(cb) cb();
    }catch(err){ toast('Erro ao ler arquivo: '+err.message); }
  };
  reader.readAsArrayBuffer(file);
}
function loadSheetIntoPending(sheetName){
  const sheet = loadedWorkbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
  finishParse(rows, null, sheetName);
}
function parsePastedText(text){
  loadedWorkbook = null;
  const lines = text.split(/\r\n|\n/).filter(l=>l.trim().length>0);
  const delim = lines[0].includes('\t') ? '\t' : (lines[0].includes(';') ? ';' : ',');
  const rows = lines.map(l=> l.split(delim).map(c=>c.trim()));
  finishParse(rows, null, null);
}
function finishParse(rows, cb, sheetName){
  if(!rows.length){ toast('Nenhum dado encontrado.'); return; }
  const headers = rows[0].map(h=>String(h||'').trim());
  const dataRows = rows.slice(1).filter(r=> r.some(c=> String(c).trim()!==''));
  const mapping = autoMapColumns(headers);
  pendingImport = { headers, rows:dataRows, mapping, sheetName: sheetName||null };
  renderMappingStep();
  if(cb) cb();
}

      </div>`;

    ['dragleave','drop'].forEach(evt=> dz.addEventListener(evt, e=>{ e.preventDefault(); dz.classList.remove('drag'); }));
    dz.addEventListener('drop', e=>{ const f=e.dataTransfer.files[0]; if(f) parseWorkbookFile(f); });
  }else{
    pane.innerHTML = `
      <div class="card">
        <label for="pasteArea" style="display:block;margin-bottom:8px;">Selecione as células no Excel, copie (Ctrl+C) e cole abaixo (Ctrl+V):</label>
        <textarea id="pasteArea" rows="8" placeholder="Cód.	Descrição	Qtd.	Un.	Orçamento Inicial	Resp.&#10;001	Tubo PVC Esgoto 100mm 6m	50	UN	2000	João"></textarea>
        <div style="margin-top:10px;"><button class="btn btn-accent" id="btnParsePaste">Processar dados colados</button></div>
      </div>`;
    document.getElementById('btnParsePaste').onclick = ()=>{
      const txt = document.getElementById('pasteArea').value;
      if(!txt.trim()){ toast('Cole os dados antes de processar.'); return; }
      parsePastedText(txt);
    };
  }
}

function renderMappingStep(){
  if(!pendingImport){ document.getElementById('mappingPane').innerHTML=''; return; }
  const { headers, rows, mapping } = pendingImport;

  const sheetSelectorHtml = (loadedWorkbook && loadedWorkbook.SheetNames.length>1) ? `
    <section class="block">
      <div class="block-head"><h2>Aba da planilha</h2><span class="note">${loadedWorkbook.SheetNames.length} abas encontradas no arquivo</span></div>
      <div class="card">
        <select id="sheetSelect" style="width:100%;">
          ${loadedWorkbook.SheetNames.map(n=>`<option ${n===pendingImport.sheetName?'selected':''}>${n}</option>`).join('')}
        </select>
        <div style="margin-top:8px;font-size:12px;color:var(--ink-soft);">Importe uma aba de cada vez — repita o processo para as demais abas (ex: Base Eldorado, Base Suzano...).</div>
      </div>
    </section>` : '';

  const rowsHtml = FIELDS.map(f=>{
    const m = mapping[f.key];
    const conf = m ? confLevel(m.score) : confLevel(0);
    const options = ['<option value="">— não mapear —</option>']
      .concat(headers.map((h,idx)=>`<option value="${idx}" ${m&&m.colIdx===idx?'selected':''}>${h||'(coluna '+(idx+1)+')'}</option>`)).join('');
    return `
      <div class="mapping-row">
        <div><strong>${f.label}</strong> ${f.required?'<span style="color:var(--red)">*</span>':''}</div>
        <div style="text-align:center;color:var(--ink-soft);">→</div>
        <select data-field="${f.key}" class="mapSelect">${options}</select>
        <span class="conf-badge conf-${conf.c}">${conf.label!=='—' ? conf.label+' confiança' : 'manual'}</span>
      </div>`;
  }).join('');

  const previewRows = rows.slice(0,5);
  const previewHead = FIELDS.map(f=> `<th>${f.label}</th>`).join('');
  const previewBody = previewRows.map(r=>{
    return '<tr>' + FIELDS.map(f=>{
      const m = mapping[f.key];
      const val = m ? (r[m.colIdx] ?? '') : '';
      return `<td>${val}</td>`;
    }).join('') + '</tr>';
  }).join('');

  const validacao = validarImportacao(rows, mapping);
  const validacaoHtml = `
    <section class="block">
      <div class="block-head"><h2>Antes de gravar</h2><span class="note">Confira o que será importado</span></div>
      <div class="card" style="display:flex;flex-direction:column;gap:6px;font-size:13px;">
        <div>✓ <strong>${validacao.linhasValidas}</strong> linha(s) válida(s) para importar</div>
        ${validacao.camposVaziosDescricao>0 ? `<div style="color:var(--red);">⚠ ${validacao.camposVaziosDescricao} linha(s) sem descrição — serão ignoradas</div>` : ''}
        ${validacao.valoresInvalidos>0 ? `<div style="color:var(--amber, #93761f);">⚠ ${validacao.valoresInvalidos} valor(es) unitário(s) não reconhecido(s) como número — vão entrar como R$ 0,00, confira depois</div>` : ''}
        ${validacao.quantidadesInvalidas>0 ? `<div style="color:var(--amber, #93761f);">⚠ ${validacao.quantidadesInvalidas} quantidade(s) não reconhecida(s) — vão entrar como 0</div>` : ''}
        ${validacao.duplicadasNoArquivo>0 ? `<div style="color:var(--amber, #93761f);">⚠ ${validacao.duplicadasNoArquivo} possível(is) item(ns) duplicado(s) dentro do próprio arquivo (mesma descrição repetida)</div>` : ''}
        ${(validacao.camposVaziosDescricao===0 && validacao.valoresInvalidos===0 && validacao.quantidadesInvalidas===0 && validacao.duplicadasNoArquivo===0) ? `<div style="color:var(--green);">Nenhum problema encontrado.</div>` : ''}
      </div>
    </section>`;

  document.getElementById('mappingPane').innerHTML = `
    ${sheetSelectorHtml}
    <section class="block">
      <div class="block-head"><h2>Mapeamento de colunas</h2><span class="note">${headers.length} colunas · ${rows.length} linhas detectadas</span></div>
      <div class="card">${rowsHtml}</div>
    </section>
    <section class="block">
      <div class="block-head"><h2>Prévia (5 primeiras linhas)</h2></div>
      <div class="table-wrap"><div class="table-scroll">
        <table><thead><tr>${previewHead}</tr></thead><tbody>${previewBody || '<tr><td colspan="'+FIELDS.length+'" style="text-align:center;color:var(--ink-soft);">Nenhuma linha para exibir</td></tr>'}</tbody></table>
      </div></div>
    </section>
    ${validacaoHtml}
    <div style="margin:16px 0;display:flex;gap:10px;">
      <button class="btn btn-primary" id="btnConfirmImport">Confirmar importação</button>
      <button class="btn btn-ghost" id="btnCancelImport">Cancelar</button>
    </div>
  `;

  document.querySelectorAll('.mapSelect').forEach(sel=>{
    sel.onchange = ()=>{
      const field = sel.dataset.field;
      const val = sel.value;
      if(val===''){ delete pendingImport.mapping[field]; }
      else{ pendingImport.mapping[field] = { colIdx:Number(val), score:100 }; }
      renderMappingStep();
    };
  });
  const sheetSel = document.getElementById('sheetSelect');
  if(sheetSel){ sheetSel.onchange = ()=> loadSheetIntoPending(sheetSel.value); }
  document.getElementById('btnCancelImport').onclick = ()=>{ pendingImport=null; loadedWorkbook=null; renderMappingStep(); };
  document.getElementById('btnConfirmImport').onclick = confirmImport;
}

function validarImportacao(rows, mapping){
  let linhasValidas=0, camposVaziosDescricao=0, valoresInvalidos=0, quantidadesInvalidas=0;
  const descricoesVistas = new Map();
  let duplicadasNoArquivo = 0;
  rows.forEach(r=>{
    const descricao = mapping.descricao ? String(r[mapping.descricao.colIdx] ?? '').trim() : '';
    if(!descricao){ camposVaziosDescricao++; return; }
    linhasValidas++;
    if(mapping.valorBase){
      const raw = r[mapping.valorBase.colIdx];
      if(raw!==undefined && raw!==null && String(raw).trim()!=='' && !parseBRNumber(raw).valid) valoresInvalidos++;
    }
    if(mapping.quantidade){
      const raw = r[mapping.quantidade.colIdx];
      if(raw!==undefined && raw!==null && String(raw).trim()!=='' && !parseBRNumber(raw).valid) quantidadesInvalidas++;
    }
    const chave = normalize(descricao);
    descricoesVistas.set(chave, (descricoesVistas.get(chave)||0)+1);
  });
  descricoesVistas.forEach(qtd=>{ if(qtd>1) duplicadasNoArquivo += qtd; });
  return { linhasValidas, camposVaziosDescricao, valoresInvalidos, quantidadesInvalidas, duplicadasNoArquivo };
}
function confirmImport(){
  const { rows, mapping } = pendingImport;
  const missingRequired = FIELDS.filter(f=>f.required && !mapping[f.key]);
  if(missingRequired.length){
    toast('Mapeie os campos obrigatórios: '+missingRequired.map(f=>f.label).join(', '));
    return;
  }
  if(rows.length > 20){ gerarBackupCompleto('antes de importação grande ('+rows.length+' linhas)'); }
  let added=0, updated=0, comValorInvalido=0, comQuantidadeInvalida=0;
  rows.forEach(r=>{
    const obj = {};
    FIELDS.forEach(f=>{
      const m = mapping[f.key];
      obj[f.key] = m ? String(r[m.colIdx] ?? '').trim() : '';
    });
    if(!obj.codigo && !obj.descricao) return;

    // motor único de valores BR — nunca vira zero sem avisar: marca o item como
    // precisando de conferência em vez de gravar um valor inventado
    const qtdParse = parseBRNumber(obj.quantidade);
    const valorParse = parseBRNumber(obj.valorBase);
    const totalParse = parseBRNumber(obj.valorTotalPlanilha);
    const quantidadeOriginalTexto = obj.quantidade;
    const valorBaseOriginalTexto = obj.valorBase;
    obj.quantidade = qtdParse.value;
    obj.valorBase = valorParse.value;
    obj.valorTotalPlanilha = totalParse.value;
    obj.valorBaseInvalido = (valorBaseOriginalTexto && !valorParse.valid) ? valorBaseOriginalTexto : null;
    obj.quantidadeInvalida = (quantidadeOriginalTexto && !qtdParse.valid) ? quantidadeOriginalTexto : null;
    if(obj.valorBaseInvalido) comValorInvalido++;
    if(obj.quantidadeInvalida) comQuantidadeInvalida++;

    // sem coluna de código na planilha-mãe: usa descrição + origem do item como
    // chave para reconhecer o mesmo item em reimportações futuras
    const existing = obj.codigo
      ? state.itens.find(i=> i.codigo === obj.codigo)
      : state.itens.find(i=> normalize(i.descricao)===normalize(obj.descricao) && normalize(i.origemItem||'')===normalize(obj.origemItem||''));

    if(existing){
      Object.assign(existing, obj);
      existing.status = existing.status || 'Pendente';
      updated++;
    }else{
      if(!obj.codigo) obj.codigo = uid('IT');
      state.itens.push({
        id: state.nextId++,
        ...obj,
        status: 'Pendente',
      });
      added++;
    }
  });
  state.importLog.push({ date: new Date().toLocaleString('pt-BR'), added, updated, total: rows.length, aba: pendingImport.sheetName||'(colado)' });
  registerLog('Importação', 'Importação de planilha', pendingImport.sheetName||'(colado)', { valorNovo: `${added} novos, ${updated} atualizados` });
  saveState();
  pendingImport = null;
  loadedWorkbook = null;
  const avisoInvalidos = (comValorInvalido+comQuantidadeInvalida)>0
    ? ` ⚠ ${comValorInvalido} valor(es) e ${comQuantidadeInvalida} quantidade(s) marcados como inválidos — filtre por "Inválidos" na Base de Itens pra corrigir.`
    : '';
  toast(`Importação concluída: ${added} novos, ${updated} atualizados.${avisoInvalidos}`);
  setView('itens');
}

function itensVisiveis(){
  const q = normalize(itensFilter.q);
  return state.itens.filter(i=>{
    if(itensFilter.soInvalidos && !(i.valorBaseInvalido||i.quantidadeInvalida)) return false;
    if(itensFilter.responsavel && i.responsavel!==itensFilter.responsavel) return false;
    if(itensFilter.status && i.status!==itensFilter.status) return false;
    if(q && !(normalize(i.codigo).includes(q) || normalize(i.descricao).includes(q))) return false;
    return true;
  });
}

  const filtered = itensVisiveis();

  if(!filtered.length){

/* -- Histórico de preços do item: todas as cotações já recebidas pra ele, aprovadas ou não -- */
function abrirHistoricoItem(itemId){
  const item = state.itens.find(i=>i.id===itemId);
  if(!item) return;
  const registros = state.itensOrcamento
    .filter(io=>io.itemBaseId===itemId)
    .map(io=>{
      const orcamento = state.orcamentos.find(o=>o.id===io.orcamentoId);
      if(!orcamento) return null;
      const fornecedor = state.fornecedores.find(f=>f.id===orcamento.fornecedorId);
      const solic = state.solicitacoes.find(s=>s.id===orcamento.solicitacaoId);
      let status = 'Sem decisão registrada';
      let statusCor = 'var(--ink-soft)';
      if(solic && solic.decisaoAprovacao){
        status = solic.decisaoAprovacao.status;
        statusCor = status==='Aprovado' ? 'var(--green)' : (status==='Reprovado' ? 'var(--red)' : 'var(--ink-soft)');
      }
      return { io, orcamento, fornecedor, solic, status, statusCor };
    })
    .filter(Boolean)
    .sort((a,b)=> b.orcamento.id - a.orcamento.id); // mais recente primeiro (IDs são sequenciais)

  const valores = registros.map(r=> Number(r.io.valorUnitario)||0).filter(v=>v>0);
  const menor = valores.length ? Math.min(...valores) : null;
  const maior = valores.length ? Math.max(...valores) : null;
  const media = valores.length ? valores.reduce((s,v)=>s+v,0)/valores.length : null;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = e=>{ if(e.target===overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="modal" style="width:640px;max-height:85vh;overflow:auto;">
      <h3>Histórico de orçamentos — ${item.descricao}</h3>
      <div class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:14px;">${item.codigo}${item.familia?' · '+item.familia:''}</div>
      ${valores.length ? `
        <div class="grid-cards" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px;">
          <div class="card kpi"><div class="card-tag">Menor</div><div class="kpi-label">Menor valor já pago</div><div class="kpi-value green">${fmtMoney(menor)}</div></div>
          <div class="card kpi"><div class="card-tag">Média</div><div class="kpi-label">Valor médio</div><div class="kpi-value">${fmtMoney(media)}</div></div>
          <div class="card kpi"><div class="card-tag">Maior</div><div class="kpi-label">Maior valor já pago</div><div class="kpi-value red">${fmtMoney(maior)}</div></div>
        </div>` : ''}
      <div class="table-wrap"><div class="table-scroll">
        <table>
          <thead><tr><th>Fornecedor</th><th>Cotação</th><th>Data</th><th class="num">Valor Unit.</th><th>Status</th></tr></thead>
          <tbody>
            ${registros.length ? registros.map(r=>`
              <tr>
                <td>${r.fornecedor ? fornecedorNome(r.fornecedor.id) : '(fornecedor removido)'}</td>
                <td class="mono">${r.solic ? r.solic.codigo : '-'}</td>
                <td>${r.orcamento.data||'-'}</td>
                <td class="num">${fmtMoney(r.io.valorUnitario)}</td>
                <td><span style="color:${r.statusCor};font-size:12px;">${r.status}</span></td>
              </tr>`).join('') : `<tr><td colspan="5" style="text-align:center;color:var(--ink-soft);">Nenhum orçamento registrado ainda para este item.</td></tr>`}
          </tbody>
        </table>
      </div></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="histFechar">Fechar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#histFechar').onclick = ()=> overlay.remove();
}

/* -- Fechamento de pedido via WhatsApp (link gratuito wa.me, sem API paga) -- */
function limparTelefoneWhats(numero){
  let d = String(numero||'').replace(/\D/g,'');
  if(!d) return '';
  if(!d.startsWith('55') && (d.length===10 || d.length===11)) d = '55'+d; // assume Brasil quando não informado o DDI
  return d;
}
/* Sobe o PDF para um serviço gratuito de compartilhamento (file.io) e retorna o link público.
   ATENÇÃO: o link fica público (qualquer pessoa com o link consegue abrir o PDF) e pode expirar
   ou ser apagado após a primeira abertura, dependendo da política do serviço.
   Se o upload falhar por qualquer motivo, retorna null e o chamador deve usar o download manual. */
async function uploadCatbox(blob, nomeArquivo){
  try{
    const form = new FormData();
    form.append('reqtype', 'fileupload');
    form.append('fileToUpload', blob, nomeArquivo);
    const res = await fetch('https://catbox.moe/user/api.php', { method:'POST', body: form });
    if(!res.ok) return null;
    const text = (await res.text()).trim();
    return text.startsWith('http') ? text : null;
  }catch(err){
    console.warn('Falha ao subir PDF (catbox):', err);
    return null;
  }
}
async function uploadFileIo(blob, nomeArquivo){
  try{
    const form = new FormData();
    form.append('file', blob, nomeArquivo);
    const res = await fetch('https://file.io/?expires=14d', { method:'POST', body: form });
    if(!res.ok) return null;
    const json = await res.json();
    return (json && json.success && json.link) ? json.link : null;
  }catch(err){
    console.warn('Falha ao subir PDF (file.io):', err);
    return null;
  }
}
/* Tenta subir o PDF em mais de um serviço gratuito de terceiro, na ordem abaixo,
   e retorna o primeiro link público que conseguir. Se todos falharem, retorna null
   e quem chamou deve usar o modo manual (baixar + anexar). */
async function uploadPdfEObterLink(blob, nomeArquivo){
  let link = await uploadCatbox(blob, nomeArquivo);
  if(link) return link;
  link = await uploadFileIo(blob, nomeArquivo);
  return link;
}
function montarMensagemFechamento(orcamento, link){
  const solic = state.solicitacoes.find(s=>s.id===orcamento.solicitacaoId);
  const fornecedor = state.fornecedores.find(f=>f.id===orcamento.fornecedorId) || {};
  const itensOrc = state.itensOrcamento.filter(io=>io.orcamentoId===orcamento.id);
  const minhaEmpresa = getMinhaEmpresa();
  const itensTexto = itensOrc.slice(0,6).map(io=>{
    const item = state.itens.find(i=>i.id===io.itemBaseId);
    return `• ${item ? item.descricao : 'item'} — ${fmtMoney(io.valorTotal)}`;
  }).join('\n');
  const maisItens = itensOrc.length>6 ? `\n(+ ${itensOrc.length-6} item(ns))` : '';
  const linhaPdf = link
    ? `📄 PDF com os detalhes completos: ${link}`
    : `Segue em anexo o PDF com os detalhes completos do pedido.`;
  // se o fornecedor ainda não tem CNPJ cadastrado, tratamos como cadastro incompleto
  // e avisamos que outra pessoa da equipe vai pedir os documentos
  const cadastroIncompleto = !fornecedor.cnpj;
  const linhaCadastro = cadastroIncompleto
    ? `\n\nEm breve, outra pessoa da nossa equipe entrará em contato para solicitar os documentos necessários para o cadastro da sua empresa em nossa base de fornecedores.`
    : '';
  return `Olá! Aqui é da ${minhaEmpresa.razaoSocial}.

Confirmando o fechamento do pedido referente à cotação ${solic?solic.codigo:''}${orcamento.numero?' (orçamento nº '+orcamento.numero+')':''}:

${itensTexto}${maisItens}

Produtos: ${fmtMoney(orcamento.valorProdutos)}
Frete: ${fmtMoney(orcamento.frete)}
Desconto: ${fmtMoney(orcamento.desconto)}
Total: ${fmtMoney(orcamento.total)}

Condição de pagamento: ${orcamento.condicaoPagamento||'-'}
Prazo de faturamento: ${orcamento.prazoFaturamento||'-'}
Prazo de entrega: ${orcamento.prazoEntrega||'-'}

${linhaPdf}${linhaCadastro}
Qualquer dúvida, seguimos à disposição. Obrigado!`;
}
function construirDocFechamento(orcamento){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const solic = state.solicitacoes.find(s=>s.id===orcamento.solicitacaoId);
  const fornecedor = state.fornecedores.find(f=>f.id===orcamento.fornecedorId) || {};
  const itensOrc = state.itensOrcamento.filter(io=>io.orcamentoId===orcamento.id);
  const minhaEmpresa = getMinhaEmpresa();

  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text(minhaEmpresa.razaoSocial || 'BASE INTELIGENTE DE ORÇAMENTOS', 14, 16);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(90);
  const enderecoLinha = [minhaEmpresa.endereco, minhaEmpresa.cep, minhaEmpresa.cidadeUf].filter(Boolean).join(' — ');
  if(enderecoLinha) doc.text(enderecoLinha, 14, 21.5);
  if(minhaEmpresa.cnpj) doc.text('CNPJ: '+minhaEmpresa.cnpj, 14, 26);
  doc.setDrawColor(210); doc.line(14, 29, 196, 29);

  doc.setTextColor(20);
  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text('CONFIRMAÇÃO DE FECHAMENTO DE PEDIDO', 14, 37);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  let y = 46;
  const infoLines = [
    ['Fornecedor:', fornecedor.razaoSocial || '-'],
    ['CNPJ:', fornecedor.cnpj || '-'],
    ['Contato:', fornecedor.contato || '-'],
    ['Cotação:', solic ? solic.codigo : '-'],
    ['Orçamento nº:', orcamento.numero || '-'],
    ['Data:', orcamento.data || new Date().toLocaleDateString('pt-BR')],
  ];
  infoLines.forEach(([l,v])=>{ doc.setFont('helvetica','bold'); doc.text(l,14,y); doc.setFont('helvetica','normal'); doc.text(String(v),48,y); y+=6; });

  const rows = itensOrc.map(io=>{
    const item = state.itens.find(i=>i.id===io.itemBaseId);
    return [item?item.codigo:'-', item?item.descricao:'(item removido)', item?item.quantidade:'-', item?item.unidade||'':'', fmtMoney(io.valorUnitario), fmtMoney(io.valorTotal)];
  });
  doc.autoTable({
    startY: y+4,
    head: [['Código','Descrição','Qtd.','Unidade','Valor Unit.','Valor Total']],
    body: rows,
    theme: 'grid',
    headStyles: { fillColor:[11,28,44] },
    styles: { fontSize:8.5 },
  });
  let fy = doc.lastAutoTable.finalY + 12;
  const resumo = [
    ['Produtos:', fmtMoney(orcamento.valorProdutos)],
    ['Frete:', fmtMoney(orcamento.frete)],
    ['Desconto:', fmtMoney(orcamento.desconto)],
    ['Total:', fmtMoney(orcamento.total)],
    ['Prazo de faturamento:', orcamento.prazoFaturamento||'-'],
    ['Prazo de entrega:', orcamento.prazoEntrega||'-'],
    ['Condição de pagamento:', orcamento.condicaoPagamento||'-'],
  ];
  resumo.forEach(([l,v])=>{ doc.setFont('helvetica','bold'); doc.text(l,14,fy); doc.setFont('helvetica','normal'); doc.text(String(v),70,fy); fy+=6.5; });
  if(orcamento.observacoes){ fy+=3; doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.text('Obs: '+orcamento.observacoes, 14, fy, {maxWidth:180}); }

  const nomeArquivo = 'fechamento-'+(solic?solic.codigo:'pedido')+'.pdf';
  return { doc, nomeArquivo };
}
function gerarPdfFechamento(orcamento){
  if(!window.jspdf) return null;
  const { doc, nomeArquivo } = construirDocFechamento(orcamento);
  doc.save(nomeArquivo);
  return nomeArquivo;
}

        </div>

  document.body.appendChild(overlay);

  overlay.querySelector('#wappBaixarPdf').onclick = ()=> doc.save(nomeArquivo);
  overlay.querySelector('#wappAbrir').onclick = ()=>{
    const texto = document.getElementById('wappTexto').value;
    window.open('https://wa.me/'+numero+'?text='+encodeURIComponent(texto), '_blank');
  };

  // tenta gerar o link em paralelo, sem travar o modal — atualiza status e texto quando resolver
  let linkGerado = null;
  try{
    linkGerado = await uploadPdfEObterLink(blob, nomeArquivo);
  }catch(err){ console.warn('Erro inesperado ao gerar link:', err); }
  if(!document.body.contains(overlay)) return; // usuário já fechou o modal
  const statusEl = document.getElementById('wappStatusLine');
  const textoEl = document.getElementById('wappTexto');
  const btnCopiar = document.getElementById('wappCopiarLink');
  if(linkGerado){
    if(statusEl) statusEl.innerHTML = '✅ Link gerado — público, pode expirar após aberto.';
    if(textoEl && textoEl.value===textoPadrao){
      textoEl.value = tipo==='solicitacao' ? montarMensagemSolicitacao(refSolic, linkGerado) : montarMensagemFechamento(refOrcamento, linkGerado);
    }
    if(btnCopiar){
      btnCopiar.style.display = 'inline-flex';
      btnCopiar.onclick = ()=>{
        navigator.clipboard.writeText(linkGerado).then(()=> toast('Link copiado.'));
      };
    }
  }else{
    if(statusEl) statusEl.innerHTML = '⚠️ Não consegui gerar o link agora (serviços de terceiro indisponíveis). Use a prévia ao lado para conferir o PDF, baixe e anexe manualmente na conversa.';
  }

  const arquivadas = state.solicitacoes.filter(s=>s.arquivada);
  if(!ativas.length){

      </div></div>
      ${arquivadas.length ? `<div style="margin-top:16px;"><a href="#" onclick="mostrarSolicitacoesArquivadas();return false;" style="color:var(--copper);font-size:12.5px;">Ver ${arquivadas.length} solicitação(ões) arquivada(s) →</a></div>` : ''}`;
    return;
  }
  body.innerHTML = ativas.slice().reverse().map(s=>{
    const orcamentosRecebidos = state.orcamentos.filter(o=>o.solicitacaoId===s.id).length;
    const decidida = s.decisaoAprovacao;
    const statusClass = decidida ? (decidida.status==='Aprovado'?'recebida':'') : (orcamentosRecebidos>0 ? 'recebida' : 'enviada');
    const statusLabel = decidida ? `${decidida.status==='Aprovado'?'✅':(decidida.status==='Reprovado'?'❌':'📤')} ${decidida.status}` : (orcamentosRecebidos>0 ? `${orcamentosRecebidos} orçamento(s) recebido(s)` : 'Aguardando orçamento');
    const conf = s.confirmacaoFornecedor;
    return `
      <div class="solic-row" style="flex-wrap:wrap;">
        <div style="flex:1;min-width:220px;">
          <div class="solic-code">${s.codigo}</div>
          <div class="solic-meta">${fornecedorNome(s.fornecedorId)} · ${s.itemIds.length} itens · enviada em ${s.data}</div>
          ${conf ? `<div style="font-size:11px;color:var(--green);margin-top:4px;">✅ Confirmado por ${conf.quem} em ${conf.data}${conf.observacao?' — "'+conf.observacao+'"':''}</div>` : ''}
          ${decidida ? `<div style="font-size:11px;color:var(--ink-soft);margin-top:2px;">Decidido por ${decidida.quem} em ${decidida.data}</div>` : ''}
        </div>
        <span class="status-tag ${statusClass}">${statusLabel}</span>
        ${orcamentosRecebidos>0 ? `<button class="btn btn-sm" onclick="abrirOrcamentosDaSolicitacao(${s.id})">👁 Ver orçamentos</button>` : ''}
        <button class="btn btn-sm" onclick="abrirWhatsAppSolicitacao(${s.id})">📲 Enviar via WhatsApp</button>
        ${conf ? `<button class="btn btn-ghost btn-sm" onclick="abrirModalConfirmacao(${s.id})">editar confirmação</button>` : `<button class="btn btn-ghost btn-sm" onclick="abrirModalConfirmacao(${s.id})">✅ Marcar confirmação</button>`}
        <button class="btn btn-ghost btn-sm" onclick="reimprimirSolicitacao(${s.id})">Baixar PDF</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="arquivarSolicitacao(${s.id})">🗑 Arquivar</button>
      </div>`;
  }).join('') + (arquivadas.length ? `<div style="margin-top:16px;"><a href="#" onclick="mostrarSolicitacoesArquivadas();return false;" style="color:var(--copper);font-size:12.5px;">Ver ${arquivadas.length} solicitação(ões) arquivada(s) →</a></div>` : '');

function arquivarSolicitacao(solicId){
  const solic = state.solicitacoes.find(s=>s.id===solicId);
  if(!solic) return;
  const orcamentosDaSolic = state.orcamentos.filter(o=>o.solicitacaoId===solicId);
  const avisoOrcamentos = orcamentosDaSolic.length
    ? `\n\nEla tem ${orcamentosDaSolic.length} orçamento(s) recebido(s) vinculado(s) — eles continuam salvos, só ficam fora das telas de comparação e do dashboard enquanto a solicitação estiver arquivada.`
    : '';
  if(!confirm(`Arquivar a solicitação ${solic.codigo}?${avisoOrcamentos}\n\nNada é apagado — dá pra restaurar depois em "Ver arquivadas".`)) return;

  solic.arquivada = true;
  solic.arquivadaEm = new Date().toLocaleString('pt-BR');

  // itens que ficaram sem nenhum orçamento ativo (fora de solicitações arquivadas) voltam a "Pendente"
  solic.itemIds.forEach(itemId=>{
    const aindaTemOrcamentoAtivo = state.itensOrcamento.some(io=>{
      if(io.itemBaseId!==itemId) return false;
      const orc = state.orcamentos.find(o=>o.id===io.orcamentoId);
      if(!orc) return false;
      const s2 = state.solicitacoes.find(x=>x.id===orc.solicitacaoId);
      return s2 && !s2.arquivada;
    });
    if(!aindaTemOrcamentoAtivo){
      const item = state.itens.find(i=>i.id===itemId);
      if(item && item.status==='Confirmado') item.status = 'Pendente';
    }
  });

  registerLog('Solicitações', 'Arquivada', solic.codigo, {});
  saveState();
  toast('Solicitação '+solic.codigo+' arquivada — pode ser restaurada quando quiser.');
  renderListaSolicitacoes();
}
function desarquivarSolicitacao(solicId){
  const solic = state.solicitacoes.find(s=>s.id===solicId);
  if(!solic) return;
  solic.arquivada = false;
  delete solic.arquivadaEm;
  // se essa solicitação tem orçamento(s) lançado(s), os itens dela voltam a "Confirmado"
  const temOrcamento = state.orcamentos.some(o=>o.solicitacaoId===solicId);
  if(temOrcamento){
    solic.itemIds.forEach(itemId=>{
      const item = state.itens.find(i=>i.id===itemId);
      if(item && item.status==='Pendente') item.status = 'Confirmado';
    });
  }
  registerLog('Solicitações', 'Restaurada do arquivo', solic.codigo, {});
  saveState();
  toast('Solicitação '+solic.codigo+' restaurada.');
  mostrarSolicitacoesArquivadas();
}

    ? `📄 PDF com a lista completa e os campos para preenchimento: ${link}`
    : `Segue em anexo o PDF com a lista completa e os campos para preenchimento (valor, frete, prazo e condição de pagamento).`;
  return `Olá! Aqui é da ${minhaEmpresa.razaoSocial}${minhaEmpresa.cnpj?' (CNPJ '+minhaEmpresa.cnpj+')':''}.

Gostaríamos de solicitar uma cotação para os itens abaixo — referência ${solic.codigo}:

${itensTexto}${maisItens}

${linhaPdf}

Aguardamos seu retorno. Qualquer dúvida, estamos à disposição. Obrigado!`;

function gerarPdfAceite(orcamentoId){
  const orcamento = state.orcamentos.find(o=>o.id===orcamentoId);
  if(!orcamento || !orcamento.aceite || !window.jspdf) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const solic = state.solicitacoes.find(s=>s.id===orcamento.solicitacaoId);
  const fornecedor = state.fornecedores.find(f=>f.id===orcamento.fornecedorId) || {};
  const itensOrc = state.itensOrcamento.filter(io=>io.orcamentoId===orcamento.id);
  const minhaEmpresa = getMinhaEmpresa();

  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text(minhaEmpresa.razaoSocial || 'BASE INTELIGENTE DE ORÇAMENTOS', 14, 16);

function renderImportarOrcamento(){
  const body = document.getElementById('cotBody');
  body.innerHTML = `
    <div class="phase-note">
      <span>ℹ</span>
      <div>A extração automática funciona com PDFs gerados digitalmente (texto selecionável). PDFs escaneados/fotografados exigem OCR — <strong>função preparada para integração futura</strong> — e não são lidos aqui.</div>
    </div>
    <div class="card">
      <div class="dropzone" id="pdfDropzone">
        <div style="font-size:22px;margin-bottom:8px;">📄</div>
        <strong>Arraste o PDF do orçamento aqui</strong> ou
        <label class="btn btn-sm" style="margin-left:4px;cursor:pointer;">Escolher arquivo
          <input type="file" id="pdfInput" accept=".pdf" style="display:none;">
        </label>
      </div>
    </div>
    <div id="pdfResultPane" style="margin-top:20px;"></div>
  `;
  const dz = document.getElementById('pdfDropzone');
  const fi = document.getElementById('pdfInput');
  fi.onchange = e=>{ if(e.target.files[0]) handlePdfUpload(e.target.files[0]); };
  ['dragenter','dragover'].forEach(evt=> dz.addEventListener(evt, e=>{ e.preventDefault(); dz.classList.add('drag'); }));
  ['dragleave','drop'].forEach(evt=> dz.addEventListener(evt, e=>{ e.preventDefault(); dz.classList.remove('drag'); }));
  dz.addEventListener('drop', e=>{ const f=e.dataTransfer.files[0]; if(f) handlePdfUpload(f); });
}
async function handlePdfUpload(file){
  if(!window.pdfjsLib){ toast('Biblioteca de leitura de PDF não carregou.'); return; }
  toast('Lendo PDF...');
  try{
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data:buf}).promise;
    let texto = '';
    for(let p=1;p<=pdf.numPages;p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      texto += content.items.map(it=>it.str).join(' ') + '\n';
    }
    if(!texto.trim()){
      toast('Não foi possível extrair texto (provavelmente um PDF escaneado). Use cadastro manual.');
    }
    importarPdfState = { file, textoExtraido:texto, solicitacaoId:null, matches:[], header:{} };
    processarTextoPdf();
  }catch(err){
    toast('Erro ao ler o PDF: '+err.message);
  }
}
function processarTextoPdf(){
  const texto = importarPdfState.textoExtraido;
  // 1) tentar localizar o código da solicitação
  const codeMatch = texto.match(/COT-\d{6}/i);
  let solic = null;
  if(codeMatch){
    solic = state.solicitacoes.find(s=> s.codigo.toUpperCase()===codeMatch[0].toUpperCase());
  }
  importarPdfState.solicitacaoId = solic ? solic.id : null;

  // 2) CNPJ do fornecedor no texto (apoio à vinculação manual)
  const cnpjMatch = texto.match(/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/);
  importarPdfState.cnpjDetectado = cnpjMatch ? cnpjMatch[0] : null;

  renderPdfResultPane();
}
function renderPdfResultPane(){
  const pane = document.getElementById('pdfResultPane');
  const solic = importarPdfState.solicitacaoId ? state.solicitacoes.find(s=>s.id===importarPdfState.solicitacaoId) : null;

  if(!solic){
    const opcoes = state.solicitacoes.map(s=>`<option value="${s.id}">${s.codigo} — ${fornecedorNome(s.fornecedorId)}</option>`).join('');
    pane.innerHTML = `
      <div class="card">
        <div style="font-size:13px;margin-bottom:10px;">
          Não foi possível localizar automaticamente a solicitação correspondente${importarPdfState.cnpjDetectado?` (CNPJ encontrado no PDF: <span class="mono">${importarPdfState.cnpjDetectado}</span>)`:''}.
          Selecione manualmente a qual solicitação este orçamento pertence:
        </div>
        <select id="manualSolicSelect" style="width:100%;"><option value="">— selecione —</option>${opcoes}</select>
        <div style="margin-top:12px;"><button class="btn btn-primary btn-sm" id="btnVincularManual">Vincular</button></div>
      </div>`;
    document.getElementById('btnVincularManual').onclick = ()=>{
      const id = Number(document.getElementById('manualSolicSelect').value);
      if(!id){ toast('Selecione uma solicitação.'); return; }
      importarPdfState.solicitacaoId = id;
      renderPdfResultPane();
    };
    return;
  }

  pane.innerHTML = `<div class="card" style="margin-bottom:16px;">
    🔄 <strong>Solicitação localizada:</strong> ${solic.codigo} — Fornecedor: ${fornecedorNome(solic.fornecedorId)} — Itens solicitados: ${solic.itemIds.length}
  </div>`;

  const itensSolicitados = state.itens.filter(i=> solic.itemIds.includes(i.id));
  const texto = importarPdfState.textoExtraido;

  // Correspondência: para cada item solicitado, procurar a linha do PDF onde o
  // código ou a descrição aparece, e avaliar a correspondência inteligente do produto
  // (entende medidas equivalentes e sinaliza conflitos técnicos, não só texto parecido).
  const matches = itensSolicitados.map(item=>{
    const linhaEncontrada = encontrarLinhaDoItem(texto, item);
    const correspondencia = linhaEncontrada
      ? avaliarCorrespondenciaProduto(item.descricao, linhaEncontrada.trecho)
      : { percentual:0, faixa:'incompativel', conflito:false, motivos:[] };
    return {
      itemId: item.id,
      codigo: item.codigo,
      descricaoBase: item.descricao,
      quantidadeSolicitada: item.quantidade,
      quantidadeCotada: item.quantidade, // por padrão assume a quantidade cheia — o usuário ajusta se vier parcial
      descricaoFornecedor: linhaEncontrada ? linhaEncontrada.trecho : '',
      valorUnitario: linhaEncontrada ? linhaEncontrada.valorUnitario : 0,
      valorTotal: linhaEncontrada ? linhaEncontrada.valorTotal : 0,
      similaridade: linhaEncontrada ? Math.max(correspondencia.percentual, 15) : 0,
      correspondencia,
      confirmado: null,
    };
  });
  importarPdfState.matches = matches;

  const FAIXA_CLASSE = { alta:'alta', boa:'alta', parcial:'media', baixa:'baixa', incompativel:'baixa' };
  const FAIXA_LABEL = { alta:'Alta correspondência', boa:'Boa correspondência', parcial:'Correspondência parcial', baixa:'Baixa correspondência', incompativel:'Não correspondente' };
  const matchRows = matches.map((m,idx)=>{
    const corresp = m.correspondencia;
    const classeConf = corresp.conflito ? 'baixa' : (FAIXA_CLASSE[corresp.faixa]||'baixa');
    const motivosHtml = (corresp.motivos||[]).map(mo=>
      `<div style="font-size:11px;color:${mo.ok?'var(--green)':'var(--red)'};">${mo.ok?'✓':(mo.forte?'🔴':'⚠')} ${mo.texto}</div>`
    ).join('');
    return `
      <div class="match-row">
        <div>${m.descricaoBase} <span class="mono" style="color:var(--ink-soft);">(${m.codigo})</span></div>
        <div style="text-align:center;color:var(--ink-soft);">↔</div>
        <div><input type="text" data-idx="${idx}" class="matchDescInput" value="${m.descricaoFornecedor}" placeholder="descrição encontrada no PDF" style="width:100%;"></div>
        <div>
          <input type="number" data-idx="${idx}" class="matchQtdInput" value="${m.quantidadeCotada}" style="width:100%;" title="Quantidade cotada (de ${m.quantidadeSolicitada} solicitada)">
          <div class="match-shortfall" id="shortfall-${idx}"></div>
        </div>
        <div><input type="number" step="0.01" data-idx="${idx}" class="matchValorInput" value="${m.valorUnitario}" style="width:100%;"></div>
        <div class="match-conf conf-${classeConf}">${corresp.conflito?'⚠ ':''}${corresp.percentual}%</div>
      </div>
      ${m.descricaoFornecedor ? `<div style="padding:0 0 10px 0;margin-top:-4px;border-bottom:1px solid var(--line-soft);">
        <div style="font-size:10.5px;color:var(--ink-soft);margin-bottom:3px;">Correspondência do produto — ${FAIXA_LABEL[corresp.faixa]}${corresp.conflito?' — ⚠ possível incompatibilidade técnica':''}</div>
        ${motivosHtml}
      </div>` : ''}`;
  }).join('');

  pane.innerHTML += `
    <section class="block">
