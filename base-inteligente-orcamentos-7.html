function encontrarLinhaDoItem(texto, item){
  // procura o código do item no texto; se não encontrar, procura por trechos da descrição
  const idxCodigo = texto.indexOf(item.codigo);
  let trechoBusca = idxCodigo>=0 ? texto.slice(idxCodigo, idxCodigo+160) : null;
  if(!trechoBusca){
    const palavras = normalize(item.descricao).split(' ').filter(w=>w.length>3).slice(0,2);
    for(const p of palavras){
      const idx = normalize(texto).indexOf(p);
      if(idx>=0){ trechoBusca = texto.slice(Math.max(0,idx-20), idx+160); break; }
    }
  }
  if(!trechoBusca) return null;
  const numeros = (trechoBusca.match(/\d{1,3}(?:\.\d{3})*(?:,\d{2})?/g) || [])
    .map(n=> Number(n.replace(/\./g,'').replace(',', '.')))
    .filter(n=> !isNaN(n) && n>0);
  const valorUnitario = numeros.length ? numeros[numeros.length-2] || numeros[0] : 0;
  const valorTotal = numeros.length ? numeros[numeros.length-1] : 0;
  return { trecho: trechoBusca.replace(/\s+/g,' ').trim().slice(0,90), valorUnitario, valorTotal };
}
function salvarOrcamentoRecebido(solic){
  const valorFrete = Number(document.getElementById('hFrete').value)||0;
  const desconto = Number(document.getElementById('hDesconto').value)||0;
  const numero = document.getElementById('hNumero').value.trim();
  const validade = document.getElementById('hValidade').value.trim();
  const faturamento = document.getElementById('hFaturamento').value.trim();
  const entrega = document.getElementById('hEntrega').value.trim();
  const pagamento = document.getElementById('hPagamento').value.trim();
  const obs = document.getElementById('hObs').value.trim();

  const valorProdutos = importarPdfState.matches.reduce((s,m)=> s + (Number(m.valorTotal)||0), 0);
  const total = valorProdutos + valorFrete - desconto;

  const orcamento = {
    id: state.nextOrcamentoId++,
    solicitacaoId: solic.id,
    fornecedorId: solic.fornecedorId,
    numero, data: new Date().toLocaleDateString('pt-BR'), validade,
    valorProdutos, desconto, frete: valorFrete, total,
    condicaoPagamento: pagamento, prazoFaturamento: faturamento, prazoEntrega: entrega,
    observacoes: obs,
  };
  state.orcamentos.push(orcamento);

  importarPdfState.matches.forEach(m=>{
    state.itensOrcamento.push({
      id: state.nextItemOrcamentoId++,
      orcamentoId: orcamento.id,
      itemBaseId: m.itemId,
      descricaoFornecedor: m.descricaoFornecedor,
      quantidadeCotada: m.quantidadeCotada,
      quantidadeSolicitada: m.quantidadeSolicitada,
      valorUnitario: m.valorUnitario,
      valorTotal: m.valorTotal,
      similaridade: m.similaridade,
    });
    // alimenta o dicionário de correspondências confirmadas
    if(m.descricaoFornecedor){
      const existente = state.correspondencias.find(c=> c.itemBaseId===m.itemId && c.fornecedorId===solic.fornecedorId);
      if(existente){ existente.descricaoFornecedor = m.descricaoFornecedor; existente.confirmado = true; }
      else{
        state.correspondencias.push({
          itemBaseId: m.itemId, descricaoFornecedor: m.descricaoFornecedor, fornecedorId: solic.fornecedorId,
          confirmado: true, data: new Date().toLocaleDateString('pt-BR'),
        });
      }
    }
    const item = state.itens.find(i=>i.id===m.itemId);
    if(item) item.status = 'Confirmado';
  });

  registerLog('Orçamentos', 'Lançado', solic.codigo+' — '+fornecedorNome(solic.fornecedorId), { valorNovo: fmtMoney(total) });
  saveState();
  toast(`Orçamento de ${fornecedorNome(solic.fornecedorId)} salvo. Total: ${fmtMoney(total)}`);
  importarPdfState = { file:null, textoExtraido:'', solicitacaoId:null, matches:[], header:{} };
  cotSubTab = 'solicitacoes';
  renderCotacoes();
}

function moverCriterio(id, delta){
  const ordenados = state.criterios.slice().sort((a,b)=>a.ordem-b.ordem);
  const idx = ordenados.findIndex(c=>c.id===id);
  const novoIdx = idx+delta;
  if(novoIdx<0 || novoIdx>=ordenados.length) return;
  const tmp = ordenados[idx].ordem;
  ordenados[idx].ordem = ordenados[novoIdx].ordem;
  ordenados[novoIdx].ordem = tmp;
  saveState();
  renderParametros();
}

/* ---- Motor de análise (usado a partir do Comparador) ---- */
function parseDias(str){
  if(str==null) return null;
  const m = String(str).match(/\d+/);
  return m ? Number(m[0]) : null;
}
function avaliarCriterio(c, o, ctx){
  switch(c.tipo){
    case 'menorPrecoFinal': {
      const vals = ctx.orcamentos.map(x=>x.total);
      const min = Math.min(...vals), max = Math.max(...vals);
      const atende = o.total===min;
      const score = max===min ? 100 : (max-o.total)/(max-min)*100;
      return { computable:true, atende, score, obs: atende ? 'É o menor total entre os orçamentos recebidos.' : `${fmtMoney(o.total-min)} acima do menor total (${fmtMoney(min)}).` };
    }
    case 'menorValorProdutos': {
      const vals = ctx.orcamentos.map(x=>x.valorProdutos);
      const min = Math.min(...vals), max = Math.max(...vals);
      const atende = o.valorProdutos===min;
      const score = max===min?100:(max-o.valorProdutos)/(max-min)*100;
      return { computable:true, atende, score, obs: atende?'Menor valor de produtos.':`${fmtMoney(o.valorProdutos-min)} acima do menor valor de produtos.` };
    }
    case 'menorFrete': {
      const vals = ctx.orcamentos.map(x=>x.frete);
      const min = Math.min(...vals), max = Math.max(...vals);
      const atende = o.frete===min;
      const score = max===min?100:(max-o.frete)/(max-min)*100;
      return { computable:true, atende, score, obs: atende?'Menor frete entre os fornecedores.':`Frete ${fmtMoney(o.frete-min)} acima do menor.` };
    }
    case 'maiorDesconto': {
      const vals = ctx.orcamentos.map(x=>x.desconto);
      const min = Math.min(...vals), max = Math.max(...vals);
      const atende = o.desconto===max;
      const score = max===min?100:(o.desconto-min)/(max-min)*100;
      return { computable:true, atende, score, obs: atende?'Maior desconto oferecido.':`Desconto ${fmtMoney(max-o.desconto)} menor que o maior oferecido.` };
    }
    case 'dentroOrcamento': {
      const temBase = ctx.valorBaseTotal>0;
      const atende = temBase ? o.total<=ctx.valorBaseTotal : null;
      return { computable:temBase, atende, score: atende?100:0, obs: temBase ? (atende?`Dentro do orçamento-base (${fmtMoney(ctx.valorBaseTotal)}).`:`${fmtMoney(o.total-ctx.valorBaseTotal)} acima do orçamento-base.`) : 'Orçamento-base não informado para estes itens.' };
    }
    case 'percentualMaximoAcima': {
      if(!(ctx.valorBaseTotal>0)) return { computable:false, atende:null, score:0, obs:'Orçamento-base não informado.' };
      const pct = (o.total-ctx.valorBaseTotal)/ctx.valorBaseTotal*100;
      const limite = Number(c.condicao.valor)||0;
      const atende = pct<=limite;
      return { computable:true, atende, score: atende?100:0, obs: `${pct>=0?'+':''}${pct.toFixed(1)}% em relação ao orçamento-base (limite: ${limite}%).` };
    }
    case 'condicaoPagamento': {
      const esperado = (c.condicao.valorEsperado||'').trim();
      if(!esperado) return { computable:false, atende:null, score:0, obs:'Condição desejada não configurada.' };
      const atende = normalize(o.condicaoPagamento||'').includes(normalize(esperado));
      return { computable:true, atende, score: atende?100:0, obs: `Oferecido: "${o.condicaoPagamento||'não informado'}" · Desejado: "${esperado}".` };
    }
    case 'prazoFaturamento':
    case 'prazoEntrega': {
      const campo = c.tipo==='prazoFaturamento' ? o.prazoFaturamento : o.prazoEntrega;
      const dias = parseDias(campo);
      if(dias===null) return { computable:false, atende:null, score:0, obs:'Prazo não informado no orçamento.' };
      const limite = Number(c.condicao.valor)||0;
      const atende = c.condicao.operador==='minimo' ? dias>=limite : dias<=limite;
      return { computable:true, atende, score: atende?100:0, obs: `Oferecido: ${dias} dias · ${c.condicao.operador==='minimo'?'mínimo':'até'} configurado: ${limite} dias.` };
    }
    case 'disponibilidade': {
      const esperado = (c.condicao.valorEsperado||'').trim();
      const real = o.disponibilidade;
      if(!esperado || real===undefined || real===null || real==='') return { computable:false, atende:null, score:0, obs:'Disponibilidade não informada nos dados importados.' };
      const atende = normalize(String(real)).includes(normalize(esperado));
      return { computable:true, atende, score: atende?100:0, obs: `Informado: "${real}" · Desejado: "${esperado}".` };
    }
    case 'validadeProposta': {
      const dias = parseDias(o.validade);
      if(dias===null) return { computable:false, atende:null, score:0, obs:'Validade da proposta não informada.' };
      const limite = Number(c.condicao.valor)||0;
      const atende = c.condicao.operador==='minimo' ? dias>=limite : dias<=limite;
      return { computable:true, atende, score: atende?100:0, obs: `Validade: ${dias} dias · limite configurado: ${limite} dias.` };
    }
    case 'personalizado': {
      const real = (o.criteriosPersonalizados && o.criteriosPersonalizados[c.id]!==undefined) ? o.criteriosPersonalizados[c.id] : null;
      if(real===null || real==='') return { computable:false, atende:null, score:0, obs:'Valor ainda não informado para este orçamento.' };
      return avaliarCriterioPersonalizado(c, real);
    }
    default:
      return { computable:false, atende:null, score:0, obs:'Critério não reconhecido.' };
  }
}
function avaliarCriterioPersonalizado(c, real){
  const esperado = c.condicao.valorEsperado||'';
  const tipo = c.condicao.tipoCondicao||'texto';
  const numReal = Number(String(real).replace(',','.'));
  const numEsp = Number(String(esperado).replace(',','.'));
  const numericoValido = !isNaN(numReal) && !isNaN(numEsp);
  let atende = false;
  switch(tipo){
    case 'igual': atende = normalize(String(real))===normalize(String(esperado)); break;
    case 'diferente': atende = normalize(String(real))!==normalize(String(esperado)); break;
    case 'maior': atende = numericoValido && numReal>numEsp; break;
    case 'menor': atende = numericoValido && numReal<numEsp; break;
    case 'maiorIgual': case 'minimo': atende = numericoValido && numReal>=numEsp; break;
    case 'menorIgual': case 'ate': atende = numericoValido && numReal<=numEsp; break;
    case 'simNao': atende = normalize(String(real)).startsWith('s') === normalize(String(esperado)).startsWith('s'); break;
    case 'texto': default: atende = normalize(String(real)).includes(normalize(String(esperado))); break;
  }
  return { computable:true, atende, score: atende?100:0, obs: `Informado: "${real}" · Esperado (${labelTipoCondicao(tipo)}): "${esperado}".` };
}

function criteriosPersonalizadosAtivosSemValor(solicIds){
  const orcamentos = state.orcamentos.filter(o=> solicIds.includes(o.solicitacaoId));
  const customAtivos = state.criterios.filter(c=>c.ativo && c.tipo==='personalizado');
  const pendentes = [];
  customAtivos.forEach(c=>{
    orcamentos.forEach(o=>{
      const val = o.criteriosPersonalizados && o.criteriosPersonalizados[c.id];
      if(val===undefined || val===null || val==='') pendentes.push({ criterio:c, orcamento:o });
    });
  });
  return pendentes;
}
function executarAnalise(solicIds, opts){
  opts = opts || {};
  const solicSelecionadas = state.solicitacoes.filter(s=> solicIds.includes(s.id));
  const orcamentos = state.orcamentos.filter(o=> solicIds.includes(o.solicitacaoId));
  const itemIdsUniao = [...new Set(solicSelecionadas.flatMap(s=>s.itemIds))];
  const valorBaseTotal = state.itens.filter(i=> itemIdsUniao.includes(i.id)).reduce((s,i)=>s+(Number(i.valorBase)||0),0);
  const ctx = { orcamentos, valorBaseTotal };
  const criteriosAtivos = state.criterios.filter(c=>c.ativo);
  const pesoTotalAtivo = criteriosAtivos.reduce((s,c)=>s+(Number(c.peso)||0), 0);

  const resultados = orcamentos.map(o=>{
    const detalhes = criteriosAtivos.map(c=>{
      const av = avaliarCriterio(c, o, ctx);
      return { criterioId:c.id, nome:c.nome, obrigatorio:c.obrigatorio, peso:c.peso, ...av };
    });
    const desqualificado = detalhes.some(d=> d.obrigatorio && d.computable && d.atende===false);
    const motivosDesqualificacao = detalhes.filter(d=>d.obrigatorio && d.computable && d.atende===false).map(d=>d.nome);
    const usaveis = detalhes.filter(d=>d.computable);
    const pesoUsavel = usaveis.reduce((s,d)=>s+(Number(d.peso)||0),0);
    const somaPonderada = usaveis.reduce((s,d)=>s+(Number(d.peso)||0)*(d.score/100),0);
    const aderencia = pesoUsavel>0 ? Math.round(somaPonderada/pesoUsavel*100) : 0;
    // Cobertura: quanto do peso configurado teve dado suficiente para ser avaliado
    // (diferente de aderência — uma proposta pode ter 90% de aderência no que foi avaliado,
    // mas só 60% de cobertura porque faltou informação em boa parte dos critérios)
    const cobertura = pesoTotalAtivo>0 ? Math.round(pesoUsavel/pesoTotalAtivo*100) : 0;
    return { orcamentoId:o.id, fornecedorId:o.fornecedorId, total:o.total, detalhes, desqualificado, motivosDesqualificacao, aderencia, cobertura };
  });

  resultados.sort((a,b)=>{
    if(opts.ignorarObrigatorios!==true && a.desqualificado!==b.desqualificado) return a.desqualificado?1:-1;
    return b.aderencia - a.aderencia;
  });

  const elegiveis = resultados.filter(r=> opts.ignorarObrigatorios===true || !r.desqualificado);
  const recomendado = elegiveis.length ? elegiveis[0] : null;

  return {
    solicitacaoIds: solicIds, data:new Date().toLocaleString('pt-BR'),
    criteriosUsados: criteriosAtivos.map(c=>({ id:c.id, nome:c.nome, peso:c.peso, obrigatorio:c.obrigatorio })),
    resultados,
    recomendadoOrcamentoId: recomendado?recomendado.orcamentoId:null,
    recomendadoOriginalOrcamentoId: recomendado?recomendado.orcamentoId:null, // nunca muda depois de calculado — preserva o que o sistema recomendou de fato
    valorBaseTotal, ignorouObrigatorios: opts.ignorarObrigatorios===true,
    decisao: null,
  };
}

  const solicIds = [...comparadorSolicIds];

    const explicacao = gerarExplicacaoRanking(r, a, idx);
    return `
      <div class="rank-card ${idx===0 && !desq ? 'top':''} ${desq?'desqualificado':''}">

function gerarExplicacaoRanking(r, a, idx){
  if(r.desqualificado && !a.ignorouObrigatorios){
    return `Não atende ao(s) critério(s) obrigatório(s): ${r.motivosDesqualificacao.join(', ')}. Mesmo que o preço possa ser competitivo, critérios obrigatórios não atendidos impedem a recomendação automática.`;
  }
  const pontosFortes = r.detalhes.filter(d=>d.computable && d.atende===true).map(d=>d.nome);
  const pontosFracos = r.detalhes.filter(d=>d.computable && d.atende===false && !d.obrigatorio).map(d=>d.nome);
  let texto = idx===0
    ? `Classificado em 1º com ${r.aderencia}% de aderência aos critérios ativos. `
    : `${r.aderencia}% de aderência aos critérios ativos. `;
  if(pontosFortes.length) texto += `Atende: ${pontosFortes.join(', ')}. `;
  if(pontosFracos.length) texto += `Não é o melhor em: ${pontosFracos.join(', ')}, mas o peso configurado não foi suficiente para mudar a posição no ranking.`;
  return texto;
}

      </div>
      <div style="font-size:11.5px;color:#9FB0C2;margin-bottom:8px;">Critérios atendidos: ${criteriosAtendidos}/${criteriosTotal} avaliados</div>
      ${naoAtendido ? `<div style="font-size:12px;color:#B8C6D6;">Critério não atendido: ${naoAtendido.nome} — ${naoAtendido.obs}</div>` : `<div style="font-size:12px;color:#B8C6D6;">Atendeu a todos os critérios computáveis configurados.</div>`}
      <div class="approval-actions">

function decidirAnalise(status){
  const foiAlterado = ultimaAnalise.recomendadoOriginalOrcamentoId!==null && ultimaAnalise.recomendadoOriginalOrcamentoId!==ultimaAnalise.recomendadoOrcamentoId;
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${status}</h3>
      ${foiAlterado ? `<div class="phase-note" style="margin-bottom:14px;"><span>ℹ</span><div>Você está escolhendo um fornecedor diferente do recomendado pelo sistema. A justificativa abaixo é obrigatória e fica registrada no histórico.</div></div>` : ''}
      <div class="field-row"><label>Seu nome</label><input id="decQuem" type="text" placeholder="Quem está registrando esta decisão"></div>
      <div class="field-row"><label>Justificativa / observações${foiAlterado?' *':''}</label><input id="decJustificativa" type="text" placeholder="${foiAlterado?'ex: prazo de entrega menor':'opcional'}"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="decCancel">Cancelar</button>
        <button class="btn btn-primary" id="decConfirmar">Confirmar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#decCancel').onclick = ()=> overlay.remove();
  overlay.querySelector('#decConfirmar').onclick = ()=>{
    const justificativa = document.getElementById('decJustificativa').value.trim();
    if(foiAlterado && !justificativa){ toast('Informe a justificativa da troca de fornecedor antes de confirmar.'); return; }
    const recomendado = ultimaAnalise.resultados.find(r=>r.orcamentoId===ultimaAnalise.recomendadoOrcamentoId);
    const recomendadoOriginal = ultimaAnalise.resultados.find(r=>r.orcamentoId===ultimaAnalise.recomendadoOriginalOrcamentoId);
    ultimaAnalise.decisao = {
      status, quem: document.getElementById('decQuem').value.trim() || '(não informado)',
      data: new Date().toLocaleString('pt-BR'),
      justificativa,
      recomendadoPeloSistema: recomendadoOriginal ? fornecedorNome(recomendadoOriginal.fornecedorId) : null,
      escolhidoPeloUsuario: foiAlterado ? fornecedorNome(recomendado.fornecedorId) : null,
    };
    registerLog('Aprovação', status, recomendado?fornecedorNome(recomendado.fornecedorId):'(sem recomendado)', {
      motivo: justificativa, origem: ultimaAnalise.decisao.quem,
      valorAnterior: foiAlterado ? 'sistema recomendou: '+ultimaAnalise.decisao.recomendadoPeloSistema : null,
    });
    // marca as solicitações envolvidas como decididas, pra não ficar parecendo "em aberto"
    (ultimaAnalise.solicitacaoIds||[]).forEach(sid=>{
      const s = state.solicitacoes.find(x=>x.id===sid);
      if(s) s.decisaoAprovacao = { status, quem: ultimaAnalise.decisao.quem, data: ultimaAnalise.decisao.data };
    });
    registrarAnalise();
    overlay.remove();
    toast('Decisão registrada: '+status+' — fechado e movido pro histórico.');
    ultimaAnalise = null;
    comparadorSubTab = 'historico';
    renderComparador();
  };
}
function alterarFornecedorRecomendado(){
  const opcoes = ultimaAnalise.resultados.map(r=>`${fornecedorNome(r.fornecedorId)} (${r.aderencia}%)`);
  const escolha = prompt('Escolha o fornecedor (digite o nome exatamente como aparece):\n'+opcoes.join('\n'));

}

  state.analises.push({ id: state.nextAnaliseId++, ...JSON.parse(JSON.stringify(ultimaAnalise)) });

/* Corresponência média do orçamento = média da correspondência inteligente de produto
   calculada item a item na hora da importação do PDF (guardada em itensOrcamento.similaridade). */
function correspondenciaMediaOrcamento(orcamentoId){
  const itens = state.itensOrcamento.filter(io=>io.orcamentoId===orcamentoId);
  if(!itens.length) return null;
  const soma = itens.reduce((s,io)=> s+(Number(io.similaridade)||0), 0);
  return Math.round(soma/itens.length);
}
function statusFornecedorNaAnalise(r, a){
  if(r.desqualificado && !a.ignorouObrigatorios) return 'Desqualificado (critério obrigatório)';
  if(a.decisao){
    if(r.orcamentoId===a.recomendadoOrcamentoId){
      return (a.recomendadoOriginalOrcamentoId===a.recomendadoOrcamentoId) ? 'Recomendado pelo sistema — '+a.decisao.status : 'Escolhido manualmente — '+a.decisao.status;
    }
    if(r.orcamentoId===a.recomendadoOriginalOrcamentoId) return 'Recomendado pelo sistema (não escolhido)';
    return 'Não selecionado';
  }
  return r.orcamentoId===a.recomendadoOrcamentoId ? 'Recomendado pelo sistema' : 'Não selecionado';
}
function exportarAnaliseXlsx(){
  if(!ultimaAnalise) return;
  const a = ultimaAnalise;
  const recomendado = a.resultados.find(r=>r.orcamentoId===a.recomendadoOrcamentoId);
  const recomendadoOriginal = a.resultados.find(r=>r.orcamentoId===a.recomendadoOriginalOrcamentoId);
  const solicCodigos = (a.solicitacaoIds||[]).map(id=>{ const s=state.solicitacoes.find(x=>x.id===id); return s?s.codigo:null; }).filter(Boolean).join(' + ');
  const wb = XLSX.utils.book_new();

  const resumo = [
    ['Cotação', solicCodigos || '-'],
    ['Data da análise', a.data],
    ['Fornecedor recomendado pelo sistema', recomendadoOriginal?fornecedorNome(recomendadoOriginal.fornecedorId):'(nenhum)'],
    ['Fornecedor escolhido/aprovado', recomendado?fornecedorNome(recomendado.fornecedorId):'(nenhum)'],
    ['Valor', recomendado?fmtMoney(recomendado.total):''],
    ['Economia vs. orçamento-base', recomendado?fmtMoney(a.valorBaseTotal-recomendado.total):''],
    ['Aderência', recomendado?recomendado.aderencia+'%':''],
    ['Cobertura', recomendado?recomendado.cobertura+'%':''],
    ['Correspondência média dos produtos', recomendado&&correspondenciaMediaOrcamento(recomendado.orcamentoId)!==null ? correspondenciaMediaOrcamento(recomendado.orcamentoId)+'%' : 'não avaliada'],
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resumo), 'RESUMO');

  const crit = [['Critério','Peso','Obrigatório'], ...a.criteriosUsados.map(c=>[c.nome,c.peso,c.obrigatorio?'Sim':'Não'])];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(crit), 'CRITERIOS');

  const forn = [
    ['Fornecedor','Valor','Correspondência','Aderência','Cobertura','Status','Motivo'],
    ...a.resultados.map(r=>{
      const corresp = correspondenciaMediaOrcamento(r.orcamentoId);
      return [
        fornecedorNome(r.fornecedorId), r.total,
        corresp!==null ? corresp+'%' : 'não avaliada',
        r.aderencia+'%', r.cobertura+'%',
        statusFornecedorNaAnalise(r, a),
        r.desqualificado ? r.motivosDesqualificacao.join('; ') : '',
      ];
    }),
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(forn), 'FORNECEDORES');

  const decisao = [
    ['Recomendação do sistema', recomendadoOriginal?fornecedorNome(recomendadoOriginal.fornecedorId):'(nenhum)'],
    ['Decisão humana', a.decisao ? (recomendado?fornecedorNome(recomendado.fornecedorId):'-') : '(ainda não decidida)'],
    ['Status', a.decisao?a.decisao.status:'-'],
    ['Justificativa', a.decisao?a.decisao.justificativa||'(não informada)':'-'],
    ['Decidido por', a.decisao?a.decisao.quem:'-'],
    ['Data da decisão', a.decisao?a.decisao.data:'-'],
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(decisao), 'DECISAO');

  XLSX.writeFile(wb, 'analise-cotacao.xlsx');
  toast('Análise exportada em Excel.');
}
function construirDocAnalise(a){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const recomendado = a.resultados.find(r=>r.orcamentoId===a.recomendadoOrcamentoId);
  const recomendadoOriginal = a.resultados.find(r=>r.orcamentoId===a.recomendadoOriginalOrcamentoId);
  const solicCodigos = (a.solicitacaoIds||[]).map(id=>{ const s=state.solicitacoes.find(x=>x.id===id); return s?s.codigo:null; }).filter(Boolean).join(' + ');
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text('RESULTADO DA ANÁLISE DE COTAÇÃO', 14, 18);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  let y = 28;
  doc.text('Cotação: '+(solicCodigos||'-'), 14, y); y+=6;
  doc.text('Recomendado pelo sistema: '+(recomendadoOriginal?fornecedorNome(recomendadoOriginal.fornecedorId):'(nenhum)'), 14, y); y+=6;
  if(recomendado){
    doc.text('Fornecedor escolhido/aprovado: '+fornecedorNome(recomendado.fornecedorId), 14, y); y+=6;
    doc.text('Total: '+fmtMoney(recomendado.total)+'   Aderência: '+recomendado.aderencia+'%   Cobertura: '+recomendado.cobertura+'%', 14, y); y+=6;
  }
  if(a.decisao){
    doc.text('Decisão: '+a.decisao.status+' por '+a.decisao.quem+' em '+a.decisao.data, 14, y); y+=6;
    if(a.decisao.justificativa){ doc.text('Justificativa: '+a.decisao.justificativa, 14, y); y+=6; }
  }
  doc.text('Data da análise: '+a.data, 14, y); y+=10;
  doc.autoTable({
    startY:y,
    head:[['Fornecedor','Valor','Correspond.','Aderência','Cobertura','Status']],
    body: a.resultados.map(r=>{
      const corresp = correspondenciaMediaOrcamento(r.orcamentoId);
      return [fornecedorNome(r.fornecedorId), fmtMoney(r.total), corresp!==null?corresp+'%':'-', r.aderencia+'%', r.cobertura+'%', statusFornecedorNaAnalise(r,a)];
    }),
    theme:'grid', headStyles:{fillColor:[11,28,44]}, styles:{fontSize:8.5},
  });
  let y2 = doc.lastAutoTable.finalY + 10;
  if(recomendado){
    doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
    doc.text('PONTOS ATENDIDOS PELO FORNECEDOR RECOMENDADO', 14, y2); y2+=7;
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    recomendado.detalhes.forEach(d=>{
      if(y2>275){ doc.addPage(); y2=20; }
      const marca = (d.computable && d.atende===true) ? '✓' : ((d.computable && d.atende===false) ? (d.obrigatorio?'X':'!') : 'i');
      doc.text(marca+' '+d.nome+' — '+d.obs, 14, y2, {maxWidth:182});
      y2 += 6;
    });
  }
  const solicCodigosArquivo = solicCodigos.replace(/[^A-Za-z0-9\-\+]/g,'') || 'analise';
  return { doc, nomeArquivo: 'analise-'+solicCodigosArquivo+'.pdf' };
}
function exportarAnalisePdf(){
  if(!window.jspdf || !ultimaAnalise) return;
  const { doc, nomeArquivo } = construirDocAnalise(ultimaAnalise);
  doc.save(nomeArquivo);
  toast('Análise exportada em PDF.');
}

/* ==================================================================
   MÓDULO EXPERIMENTAL — ANÁLISE VIA WHATSAPP
   Cria uma análise → gera link (token único) → envia por WhatsApp →
   pessoa preenche → sistema registra a resposta.
   IMPORTANTE: como o sistema roda só no navegador (sem servidor), o
   "link" só funciona de verdade dentro deste mesmo navegador — é um
   MODO DE TESTE LOCAL, simulado via localStorage. Não é um link
   público de internet. O botão "Abrir análise (teste)" simula
   exatamente a experiência de quem receberia o link de verdade.
   Reaproveita: state.itens, state.solicitacoes, state.fornecedores,
   fornecedorNome(), limparTelefoneWhats(), getMinhaEmpresa(),
   registerLog(), saveState() — nada do motor de análise existente
   (executarAnalise, critérios, aderência) foi alterado.
================================================================== */
function gerarTokenAnalise(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<7;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return 'WA-'+s;
}
/* -- Codificação Unicode-segura em base64, pra guardar os dados da análise dentro do próprio link -- */
function b64EncodeUnicode(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m,p1)=> String.fromCharCode('0x'+p1)));
}
function b64DecodeUnicode(str){
  return decodeURIComponent(atob(str).split('').map(c=> '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
}
/* -- Endereço público do sistema (ex: GitHub Pages) -- configurado uma vez, usado em todos os
   links gerados daqui pra frente, mesmo quando você continuar trabalhando pela versão local. */
const URL_PUBLICA_KEY = 'bio_url_publica_sistema';
function getUrlPublicaSistema(){ return (localStorage.getItem(URL_PUBLICA_KEY) || '').trim(); }
function setUrlPublicaSistema(url){ localStorage.setItem(URL_PUBLICA_KEY, url.trim()); }
/* Monta o link público de verdade — os dados da análise vão embutidos no próprio link
   (não dependem de localStorage), então funcionam em qualquer aparelho, DESDE QUE haja
   um endereço público real por trás (configurado abaixo, ou o próprio endereço atual). */
function gerarLinkPublicoAnalise(a){
  const payload = {
    tk: a.token, t:a.titulo, r:a.referencia, d:a.descricao, fn:a.fornecedorNome,
    itens:a.itens, campos:a.camposSolicitados, camposP:a.camposPersonalizados,
    prazo:a.prazo, criadoEm:a.criadoEm, orc:a.orcamentosRecebidos||[],
  };
  const b64 = b64EncodeUnicode(JSON.stringify(payload));
  const urlConfigurada = getUrlPublicaSistema();
  const base = urlConfigurada || (location.origin + location.pathname);
  const separador = base.includes('?') ? '&' : '?';
  return base + separador + 'analise=' + b64;
}
function statusAnaliseWa(a){
  if(a.desativado) return { code:'desativado', label:'⚫ Desativado' };
  // fecha sozinha quando a cotação de origem já foi decidida (aprovada/reprovada) —
  // vale a partir do momento em que você reabrir/reenviar; links já copiados antes
  // não sabem disso sozinhos, porque não têm como "avisar" o navegador de quem recebeu.
  if(a.origemTipo==='solicitacao' && a.origemId){
    const solic = state.solicitacoes.find(s=>s.id===a.origemId);
    if(solic && solic.decisaoAprovacao) return { code:'desativado', label:'⚫ Encerrada (cotação já decidida)' };
  }
  if(a.resposta) return { code:'respondido', label:'🔵 Respondido' };
  const agora = new Date();
  const prazoDate = a.prazo ? new Date(a.prazo) : null;
  if(!prazoDate || isNaN(prazoDate.getTime())) return { code:'ativo', label:'🟢 Ativo' };
  if(agora > prazoDate) return { code:'expirado', label:'🔴 Expirado' };
  const diffH = (prazoDate-agora)/3600000;
  if(diffH <= 24) return { code:'proximoVencimento', label:'🟠 Próximo do vencimento' };
  return { code:'ativo', label:'🟢 Ativo' };
}
function nomeCampoWaGlobal(a, key){
  const padrao = CAMPOS_ANALISE_WA_PADRAO.find(c=>c.key===key);
  if(padrao) return padrao.label;
  const custom = (a.camposPersonalizados||[]).find(c=>c.key===key);
  return custom ? custom.label : key;
}
function nomeCampoWa(key){
  const padrao = CAMPOS_ANALISE_WA_PADRAO.find(c=>c.key===key);
  if(padrao) return padrao.label;
  const custom = novaAnaliseWaDraft && novaAnaliseWaDraft.camposPersonalizados.find(c=>c.key===key);
  return custom ? custom.label : key;
}

/* Coleta os orçamentos já lançados pra uma solicitação (fornecedor, valores, prazos, itens) —

function coletarOrcamentosRecebidos(solicId){

      renderWaPreview(d);
    };
  });
  document.getElementById('btnAddCampoWa').onclick = ()=>{
    const nome = document.getElementById('waNovoCampoNome').value.trim();
    if(!nome) return;
    const key = 'custom_'+normalize(nome).replace(/\s+/g,'_');
    d.camposPersonalizados.push({ key, label:nome });
    d.camposSolicitados.push(key);
    document.getElementById('waNovoCampoNome').value='';
    renderWaCamposPersonalizados();
    renderWaPreview(d);
  };
  document.getElementById('btnGerarLinkWa').onclick = ()=> confirmarGeracaoLinkWa();

  renderWaOrigemDetalhe();
  renderWaCamposPersonalizados();
  renderWaPreview(d);
}
function renderWaOrigemDetalhe(){
  const d = novaAnaliseWaDraft;
  const el = document.getElementById('waOrigemDetalhe');
  if(!el) return;
  if(d.origemTipo==='solicitacao'){
    const solics = state.solicitacoes.filter(s=>!s.arquivada);
    el.innerHTML = `
      <label>Escolha a solicitação</label>
      <select id="waSolicSelect" style="width:100%;margin-top:6px;">
        <option value="">— selecione —</option>
        ${solics.map(s=>`<option value="${s.id}" ${d.origemId===s.id?'selected':''}>${s.codigo} — ${fornecedorNome(s.fornecedorId)}</option>`).join('')}
      </select>`;
    document.getElementById('waSolicSelect').onchange = (e)=>{
      const sid = Number(e.target.value);
      d.origemId = sid || null;
      const solic = state.solicitacoes.find(s=>s.id===sid);
      if(solic){
        d.itens = state.itens.filter(i=>solic.itemIds.includes(i.id)).map(i=>({ descricao:i.descricao, quantidade:i.quantidade, unidade:i.unidade||'' }));
        d.fornecedorNome = fornecedorNome(solic.fornecedorId);
        d.orcamentosRecebidos = coletarOrcamentosRecebidos(sid);
        if(!d.referencia){ d.referencia = solic.codigo; document.getElementById('waReferencia').value = solic.codigo; }
      }else{
        d.itens = []; d.fornecedorNome = ''; d.orcamentosRecebidos = [];
      }
      renderWaPreview(d);
    };
  }else{
    el.innerHTML = `
      <label>Itens (um por linha: descrição, quantidade, unidade)</label>
      <textarea id="waItensManual" rows="4" style="width:100%;margin-top:6px;" placeholder="Tubo PVC 100mm, 50, UN">${d.itensManualTexto}</textarea>`;
    document.getElementById('waItensManual').oninput = (e)=>{
      d.itensManualTexto = e.target.value;
      d.itens = e.target.value.split('\n').filter(l=>l.trim()).map(l=>{
        const partes = l.split(',').map(p=>p.trim());
        return { descricao: partes[0]||'', quantidade: partes[1]||'', unidade: partes[2]||'' };
      });
      renderWaPreview(d);
    };
  }
}

function confirmarGeracaoLinkWa(){
  const d = novaAnaliseWaDraft;
  if(!d.titulo.trim()){ toast('Dê um título pra análise.'); return; }
  if(!d.prazo){ toast('Defina um prazo pra resposta.'); return; }
  if(!d.itens.length){ toast('Adicione pelo menos um item (via solicitação ou manual).'); return; }
  criarAnaliseWhatsApp(d);
}
function criarAnaliseWhatsApp(d){
  const token = gerarTokenAnalise();
  const nova = {
    id: state.nextAnaliseWaId++,
    token,
    titulo: d.titulo.trim(), referencia: d.referencia.trim(), descricao: d.descricao.trim(),
    origemTipo: d.origemTipo, origemId: d.origemId, fornecedorNome: d.fornecedorNome,
    itens: d.itens,
    orcamentosRecebidos: d.orcamentosRecebidos || [],
    camposSolicitados: d.camposSolicitados,
    camposPersonalizados: d.camposPersonalizados,
    prazo: d.prazo,
    criadoEm: new Date().toISOString(),
    desativado: false,
    resposta: null,
  };
  state.analisesWhatsApp.push(nova);
  registerLog('Análise WhatsApp', 'Link criado', nova.titulo+' ('+token+')', {});
  saveState();
  toast('Link gerado com sucesso.');
  analiseWaSubView = 'detalhe';
  analiseWaDetalheId = nova.id;
  novaAnaliseWaDraft = null;
  renderTelaAnaliseInterna();
}

function copiarLinkAnalise(token){
  const a = carregarAnaliseWhatsApp(token);
  if(!a){ toast('Análise não encontrada.'); return; }
  const link = gerarLinkPublicoAnalise(a);
  navigator.clipboard.writeText(link).then(()=> toast('Link copiado.'));
}
function gerarNovoLinkWa(id){
  const a = state.analisesWhatsApp.find(x=>x.id===id);
  if(!a) return;
  if(!confirm('Gerar um novo link substitui o token atual (o link antigo para de funcionar). Continuar?')) return;
  a.token = gerarTokenAnalise();
  registerLog('Análise WhatsApp', 'Novo link gerado', a.titulo, {});
  saveState();
  toast('Novo link gerado.');
  renderDetalheAnaliseWa(id);
}
function desativarLinkWa(id){
  const a = state.analisesWhatsApp.find(x=>x.id===id);
  if(!a) return;
  a.desativado = true;
  registerLog('Análise WhatsApp', 'Link desativado', a.titulo, {});
  saveState();
  toast('Link desativado.');
  renderDetalheAnaliseWa(id);
}
function reativarLinkWa(id){
  const a = state.analisesWhatsApp.find(x=>x.id===id);
  if(!a) return;
  a.desativado = false;
  registerLog('Análise WhatsApp', 'Link reativado', a.titulo, {});
  saveState();
  toast('Link reativado.');
  renderDetalheAnaliseWa(id);
}
function expirarAnaliseWhatsApp(id){
  // função de teste — força o prazo pro passado, pra validar a tela de "link expirado"
  const a = state.analisesWhatsApp.find(x=>x.id===id);
  if(!a) return;
  a.prazo = new Date(Date.now() - 3600000).toISOString().slice(0,16);
  saveState();
  toast('Prazo forçado para o passado (teste de expiração).');
  renderDetalheAnaliseWa(id);
}

function montarMensagemAnaliseSemLink(a){

${a.titulo}${a.referencia?' — '+a.referencia:''}

${a.descricao||'Favor preencher as informações abaixo para cada item e responder por aqui mesmo.'}

${itensTexto}${orcamentosTxt}

function enviarAnaliseWhatsApp(id){
  const a = state.analisesWhatsApp.find(x=>x.id===id);
  if(!a) return;
  const textoPadrao = montarMensagemAnaliseComLink(a);

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" style="width:520px;">
      <h3>Enviar análise via WhatsApp</h3>
      <div class="field-row"><label>Telefone (com DDD)</label><input id="waEnvioTelefone" type="text" placeholder="ex: 67 99999-8888" value="${getContatoAprovacaoSalvo()}"></div>
      <div class="field-row"><label>Mensagem (edite à vontade)</label><textarea id="waEnvioTexto" rows="14" style="width:100%;font-family:'IBM Plex Mono',monospace;font-size:12px;">${textoPadrao}</textarea></div>
      <div style="font-size:11px;color:var(--ink-soft);margin-bottom:8px;">Se preferir mandar sem link (texto pra responder direto), <a href="#" id="waEnvioSemLink" style="color:var(--copper);">clique aqui</a>.</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="waEnvioCancel">Cancelar</button>
        <button class="btn btn-primary" id="waEnvioAbrir">Abrir WhatsApp</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#waEnvioCancel').onclick = ()=> overlay.remove();
  overlay.querySelector('#waEnvioSemLink').onclick = (e)=>{ e.preventDefault(); document.getElementById('waEnvioTexto').value = montarMensagemAnaliseSemLink(a); };
  overlay.querySelector('#waEnvioAbrir').onclick = ()=>{
    const numero = limparTelefoneWhats(document.getElementById('waEnvioTelefone').value);
    if(!numero){ toast('Informe um telefone válido.'); return; }
    localStorage.setItem(CONTATO_APROVACAO_KEY, document.getElementById('waEnvioTelefone').value.trim());
    const texto = document.getElementById('waEnvioTexto').value;
    window.open('https://wa.me/'+numero+'?text='+encodeURIComponent(texto), '_blank');
    overlay.remove();
  };
}

function renderTelaAnaliseExterna(tokenOuPayload){
  let a = null;
  if(typeof tokenOuPayload === 'string'){

    // veio de um link real, com os dados embutidos — pode ser um aparelho que nunca teve esse sistema aberto

      token: tokenOuPayload.tk, titulo: tokenOuPayload.t, referencia: tokenOuPayload.r, descricao: tokenOuPayload.d,
      fornecedorNome: tokenOuPayload.fn, itens: tokenOuPayload.itens||[], camposSolicitados: tokenOuPayload.campos||[],
      camposPersonalizados: tokenOuPayload.camposP||[], prazo: tokenOuPayload.prazo, criadoEm: tokenOuPayload.criadoEm,
      orcamentosRecebidos: tokenOuPayload.orc||[], desativado:false, resposta:null, _somentePayload:true,

/* -- Processa o código de resposta colado (gerado por quem respondeu num aparelho sem estado local) -- */
function processarCodigoRespostaColado(id){
  const a = state.analisesWhatsApp.find(x=>x.id===id);
  if(!a) return;
  const codigo = document.getElementById('waColarCodigo').value.trim();
  if(!codigo){ toast('Cole o código primeiro.'); return; }
  let payload;
  try{
    payload = JSON.parse(b64DecodeUnicode(codigo));
  }catch(err){
    toast('Código inválido — copie exatamente o texto que a pessoa te mandou.');
    return;
  }
  if(payload.tk && payload.tk!==a.token){
    if(!confirm('Esse código parece ser de outra análise (referência diferente). Registrar mesmo assim?')) return;
  }
  responderAnaliseWhatsApp(a.token, {
    itens: payload.itens||[], nomeResponsavel: payload.nomeResponsavel||'(não informado)',
    observacoesGerais: payload.observacoesGerais||'',
  });
  analiseWaSubView = 'detalhe';
  analiseWaDetalheId = a.id;
  renderTelaAnaliseInterna();
  toast('Resposta registrada a partir do código.');
}

  saveState();
  renderConfirmacaoAnaliseWa(a);
}

function exportFornecedoresXlsx(){
  if(!state.fornecedores.length){ toast('Não há fornecedores para exportar.'); return; }
  const head = ['Razão Social','Nome Fantasia','CNPJ','Telefone','WhatsApp','E-mail','Endereço','Contato','Observações','Data de Cadastro'];
  const rows = state.fornecedores.map(f=> [f.razaoSocial,f.nomeFantasia,f.cnpj,f.telefone,f.whatsapp,f.email,f.endereco,f.contato,f.observacoes,f.dataCadastro]);
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([head, ...rows]);
  XLSX.utils.book_append_sheet(wb, ws, 'FORNECEDORES');
  XLSX.writeFile(wb, 'fornecedores.xlsx');
  toast('Arquivo .xlsx exportado.');
}
function itensAsAOA(){
  const head = ['Código','Descrição','Descrição Longa','Família / Aba Origem','Macro Família','Subgrupo Técnico','Origem do Item','Tipo de Material','Classificação','Quantidade','Unidade','Valor Unitário','Valor Total (planilha)','Responsável','Status'];
  const rows = state.itens.map(i=> [
    i.codigo, i.descricao, i.descricaoLonga, i.familia, i.macroFamilia, i.subgrupoTecnico, i.origemItem,
    i.tipoMaterial, i.classificacao, i.quantidade, i.unidade, i.valorBase, i.valorTotalPlanilha, i.responsavel, i.status,
  ]);
  return [head, ...rows];
}
function exportXlsx(){
  if(!state.itens.length){ toast('Não há itens para exportar.'); return; }
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(itensAsAOA());
  XLSX.utils.book_append_sheet(wb, ws, 'BASE_ITENS');
  XLSX.writeFile(wb, 'base_inteligente_orcamentos.xlsx');
  toast('Arquivo .xlsx exportado.');
}
function exportCsv(){
  if(!state.itens.length){ toast('Não há itens para exportar.'); return; }
  const aoa = itensAsAOA();
  const csv = aoa.map(r=> r.map(c=>{
    const s = String(c ?? '');
    return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(';')).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  downloadBlob(blob, 'base_inteligente_orcamentos.csv');
  toast('Arquivo .csv exportado.');
}
function exportJson(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  downloadBlob(blob, 'backup_base_inteligente_orcamentos.json');
  toast('Backup exportado.');
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ---------------- Boot ---------------- */
document.querySelectorAll('.nav-item').forEach(el=>{
  el.addEventListener('click', ()=> setView(el.dataset.view));
});
document.getElementById('btnResetData').onclick = ()=>{
  if(confirm('Isso apagará todos os itens salvos localmente. Continuar?')){
    state = { itens: [], nextId: 1, importLog: [] };
    saveState();
    toast('Base limpa.');
    setView(currentView);
  }
};
document.getElementById('pillDate').textContent = new Date().toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric'});
atualizarPillSyncStatus();

seedCriteriosPadrao();

/* -- Interceptor de link de Análise via WhatsApp --
   Se a URL tiver ?analise=..., é porque alguém clicou num link de análise:
   abre SÓ aquela tela (sem menu, sem o resto do sistema), sem passar pelo dashboard. */
(function interceptarLinkDeAnalise(){
  const params = new URLSearchParams(location.search);
  const dadoAnalise = params.get('analise');
  if(!dadoAnalise) { setView('dashboard'); return; }
  try{
    const payload = JSON.parse(b64DecodeUnicode(dadoAnalise));
    document.body.classList.add('wa-external-mode');
    renderTelaAnaliseExterna(payload);
  }catch(err){
    document.getElementById('content').innerHTML = `<div class="card" style="text-align:center;padding:60px 20px;"><h3>Link inválido</h3><p style="color:var(--ink-soft);">Não consegui ler os dados desse link.</p></div>`;
    document.body.classList.add('wa-external-mode');
  }
})();
</script>
