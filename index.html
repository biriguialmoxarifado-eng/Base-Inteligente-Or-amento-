<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALMOXA PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 20%, #16548F 0%, #0C2E51 60%, #071b30 100%);
    font-family:'Inter',sans-serif;padding:24px;}
  .ponte-card{background:#fff;border-radius:16px;padding:40px 28px;max-width:380px;width:100%;text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,0.3);}
  .ponte-spinner{width:26px;height:26px;border-radius:50%;border:3px solid #E9F0F9;border-top-color:#12406F;
    animation:spin .8s linear infinite;margin:0 auto 18px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .ponte-mark{width:52px;height:52px;border-radius:10px;background:#12406F;color:#E07A2C;display:flex;
    align-items:center;justify-content:center;font-family:'Manrope';font-weight:800;font-size:18px;margin:0 auto 14px;}
  h1{font-family:'Manrope';font-size:18px;margin:0 0 2px;color:#16202B;}
  .ponte-sub{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:1.2px;color:#8C99A6;text-transform:uppercase;margin:0 0 18px;}
  .ponte-msg{font-size:13px;color:#5B6B7C;margin:0 0 20px;}
  .ponte-link{background:none;border:none;font-size:11.5px;color:#8C99A6;text-decoration:underline;cursor:pointer;padding:0;}
  .ponte-picker{display:none;gap:10px;margin-top:16px;}
  .ponte-picker.show{display:flex;}
  .ponte-picker button{flex:1;padding:12px 6px;border-radius:8px;border:1px solid #E1E6EC;background:#F4F6F9;
    font-size:12px;font-weight:600;color:#16202B;cursor:pointer;}
  .ponte-picker button:active{background:#E9F0F9;border-color:#12406F;}
</style>
</head>
<body>
  <div id="ponteRoot"></div>
  <script type="module">
    import { iniciarPonte } from './core/router.js';
    iniciarPonte({ mountEl: document.getElementById('ponteRoot') });
  </script>
</body>
</html>
